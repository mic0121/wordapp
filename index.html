<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Apple_Notes_icon.svg/1024px-Apple_Notes_icon.svg.png">
<title>Notes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg: #000; --s2: #1C1C1E; --txt: #FFFFFF; --txt-back: #FFD60A; }

html, body { height: 100%; background: #000; display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; overflow: hidden; }

.phone { width: 393px; height: 852px; background: var(--bg); border-radius: 54px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
@media (max-height: 870px) { .phone { height: 100vh; width: calc(100vh * 0.46); } }
@media (max-width: 420px) { .phone { width: 100vw; height: 100dvh; border-radius: 0; } }

.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 100; }

.navbar { height: 100px; padding: 45px 12px 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 30; }
.nav-back-pill { display: flex; align-items: center; gap: 6px; background: var(--s2); border-radius: 20px; padding: 6px 12px 6px 8px; cursor: pointer; }
.nav-back-text { font-size: 17px; color: var(--txt-back); }
.nav-right-pill { display: flex; align-items: center; gap: 12px; background: var(--s2); border-radius: 20px; padding: 6px 14px; }

.dots { display: flex; align-items: center; gap: 3.5px; cursor: pointer; padding: 5px; }
.dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--txt); opacity: 0.3; transition: 0.3s; }
.dots.active .dot { background: var(--txt-back); opacity: 1; box-shadow: 0 0 8px var(--txt-back); }

.note-body { flex: 1; overflow-y: auto; padding: 10px 20px 120px; }
.note-editor { width: 100%; min-height: 100%; font-size: 19px; line-height: 1.5; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--txt-back); white-space: pre-wrap; }

.reveals .replaced-word { font-size: 32px; font-weight: 800; color: var(--txt-back); text-transform: uppercase; display: block; margin-bottom: 8px; }
.anagram-line { font-size: 20px; color: #fff; margin-bottom: 12px; line-height: 1.4; border-bottom: 1px solid #1c1c1e; padding-bottom: 8px; }
.anagram-letter { color: var(--txt-back); font-weight: 800; font-size: 24px; margin-right: 12px; }

.toolbar-container { 
    position: absolute; 
    bottom: 8px; 
    left: 0; 
    width: 100%; 
    padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    z-index: 50;
}
.tb-main-pill { display: flex; align-items: center; gap: 28px; background: #1c1c1e; border-radius: 30px; padding: 14px 25px; border: 0.5px solid #333; }
.tb-icon-svg { width: 24px; height: 24px; stroke: #fff; stroke-width: 1.6; fill: none; cursor: pointer; }
.tb-new-btn { background: #1c1c1e; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border: 0.5px solid #333; }
</style>
</head>
<body>

<div class="phone">
    <div class="island"></div>
    <div class="navbar">
        <div class="nav-back-pill" id="backBtn">
            <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M9 1L1 8L9 15" stroke="#FFD60A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-back-text">Notes</span>
        </div>
        <div class="nav-right-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 15V3m-4 4l4-4 4 4M4 12v8h16v-8"/></svg>
            <div style="width: 1px; height: 15px; background: rgba(255,255,255,0.1);"></div>
            <div id="dotsBtn" class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>
    </div>

    <div class="note-body">
        <div class="note-editor" id="noteEditor" contenteditable="true" spellcheck="false" placeholder="Commencez à écrire..."></div>
    </div>

    <div class="toolbar-container">
        <div class="tb-main-pill">
            <svg id="anagramBtn" class="tb-icon-svg" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><rect x="2" y="4" width="14" height="14" rx="2"/></svg>
            <svg class="tb-icon-svg" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            <svg class="tb-icon-svg" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
            <svg class="tb-icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        </div>
        <div class="tb-new-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
    </div>
</div>

<script>
const DICTIONARY = ["MARIAGE","BAGUE","VAGUE","SOURRE","CAPRICORNE","SIRENE","ACTE","AIDE","AIMER","AIR","ALLER","AMIS","AMOUR","APPEL","ARBRE","ARME","ARRET","ART","ASPECT","AUTO","AVANT","AVION","AVIS","AVRIL","BAC","BAIN","BAL","BANC","BAS","BATEAU","BEAU","BEBE","BEC","BELGE","BELLE","BETE","BIEN","BIERE","BILLET","BLEU","BLOC","BOIRE","BOIS","BOITE","BON","BORD","BOUCHE","BOUT","BRAS","BRUIT","BUREAU","BUT","CACHE","CAFE","CAMP","CAR","CARTE","CAS","CAUSE","CELA","CENT","CERCLE","CESSER","CHAMP","CHANT","CHAISE","CHANCE","CHANGER","CHAQUE","CHARME","CHASSE","CHAT","CHAUD","CHEF","CHEMIN","CHER","CHEVAL","CHEVEUX","CHEZ","CHIEN","CHOISIR","CHOSE","CIEL","CINQ","CITE","CLAIR","CLEF","COEUR","COIN","COL","COLERE","COMME","COMPTE","CONTRE","CORPS","COTE","COUP","COUR","COURS","COURT","COUTE","CROIRE","CUISINE","DAME","DANS","DATE","DEBUT","DEDANS","DEHORS","DEMAIN","DENT","DEPART","DESIR","DESSUS","DEVANT","DEVOIR","DIEU","DIGNE","DIRE","DIX","DOIGT","DONNER","DORMIR","DOS","DOUBLE","DOUCE","DROIT","DUR","EAU","ECOLE","ECRIRE","EFFET","EGAL","EGLISE","ELEVE","ENFANT","ENFIN","ENCORE","ENTRE","ENVIE","ERREUR","ESPRIT","ETAPE","ETAT","ETE","ETRE","ETUDE","EVITER","EXEMPLE","FACE","FACILE","FAIM","FAIRE","FAIT","FALLOIR","FAMILLE","FAUTE","FEMME","FER","FETE","FEU","FEUILLE","FIGURE","FILLE","FILM","FILS","FIN","FINIR","FLEUR","FLUX","FOI","FOIS","FOND","FORCE","FORME","FORT","FOU","FOULE","FRAIS","FRANC","FRAPPE","FRERE","FROID","FRONT","FRUIT","FUITE","FUMEE","FUSIL","GAGE","GAGNER","GARCON","GARDE","GARE","GAUCHE","GENRE","GENS","GESTE","GLACE","GRAIN","GRAND","GRAS","GRAVE","GRIS","GROS","GROUPE","GUERRE","HABIT","HAUT","HERBE","HEURE","HIER","HIVER","HOMME","HONNEUR","HONTE","HOTEL","HUIT","HUMAIN","ICI","IDEE","IMAGE","IMPORT","INSTANT","INTERET","INVITE","ISSOLE","JALOUX","JAMAIS","JAMBE","JARDIN","JAUNE","JET","JEU","JEUDI","JEUNE","JOIE","JOLI","JOUE","JOUER","JOUR","JUGE","JUIF","JUILLET","JUIN","JUPITER","JURER","JUSQUE","JUSTE","KILO","LAC","LAINE","LAISSER","LAIT","LANGUE","LARGE","LARMES","LECON","LENDEMAIN","LETTRE","LEUR","LEVER","LIBRE","LIEN","LIEU","LIGNE","LIRE","LIT","LIVRE","LOI","LOIN","LONG","LORQU","LOT","LOUIS","LOUP","LOURD","LUTTE","LUXE","MACHINE","MADAME","MAGASIN","MAI","MAIN","MAIRIE","MAISON","MAITRE","MAL","MALADE","MANGER","MANQUE","MARCHE","MARDI","MARI","MARS","MATIN","MAUVAIS","MEDECIN","MEME","MEMOIRE","MENER","MER","MERCI","MERE","MESURE","METTRE","MEUBLE","MIDI","MIEUX","MILIEU","MILLE","MINCE","MINISTRE","MINUTE","MIROIR","MISE","MODE","MOI","MOINS","MOIS","MOMENT","MONDE","MONSIEUR","MONTAGNE","MONTER","MONTRE","MORCEAU","MORT","MOT","MOUCHE","MOURIR","MOUVEMENT","MOYEN","MUR","MUSIQUE","NAISSANCE","NATURE","NAVIRE","NEIGE","NEUF","NEZ","NOBLE","NOEL","NOIR","NOM","NOMBRE","NOMMER","NON","NORD","NOTE","NOTRE","NOUS","NOUVEAU","NUAGE","NUIT","NUMERO","OBJET","OBLIGER","OCCUPER","OEIL","OEUF","OFFRE","OISEAU","OMBRE","ONCLE","ONZE","OR","ORDRE","OREILLE","ORGUEIL","OS","OSER","OU","OUBLIER","OUEST","OUI","OUTIL","OUVERT","OUVRIR","PAGE","PAIN","PAIX","PALAIS","PAPIER","PAQUET","PAR","PARADIS","PARAITRE","PARCE","PARDON","PAREIL","PARENT","PARFOIS","PARLER","PARMI","PAROLE","PART","PARTI","PARTIR","PARTOUT","PAS","PASSAGE","PASSER","PASSE","PATRON","PAYER","PAYS","PEINE","PEINTRE","PENDANT","PENSEE","PENSER","PERDRE","PERE","PERMETTRE","PETIT","PEUPLE","PEUR","PHRASE","PIECE","PIED","PIERRE","PLACE","PLAISIR","PLAN","PLANT","PLATE","PLEIN","PLEURER","PLUIE","PLUS","POCHE","POEME","POESIE","POIDS","POINT","POISSON","POLICE","POMME","PONT","PORT","PORTE","PORTER","POSER","POSTE","POUCE","POUR","POURQUOI","POUSSER","POUVOIR","PREMIER","PRENDRE","PRES","PRESENT","PRESQUE","PRET","PREUVE","PREVENIR","PRIER","PRINCE","PRISON","PRIX","PROCHE","PROJET","PROMET","PROPRE","PUIS","QUAND","QUART","QUATRE","QUEL","QUELQUE","QUESTION","QUEUE","QUITTER","QUOI","RACE","RAISON","RAMENER","RANG","RAPIDE","RAPPEL","RAPPORT","RARE","RATER","RAYON","REALITE","RECEVOIR","REGARD","REGLE","REINE","REJET","RELATION","REMARQUE","REMPLIR","RENDRE","REPAS","REPONSE","REPOS","REPRENDRE","RESTER","RETARD","RETOUR","REUSSIR","REVE","REVENIR","REVOIR","REVUE","RICHE","RIDEAU","RIEN","RIRE","RISQUE","RIVIERE","ROBE","ROI","ROMAN","ROND","ROSE","ROUE","ROUGE","ROUTE","RUE","SABLE","SAC","SAINT","SAISIR","SAISON","SALLE","SANG","SANS","SANTE","SAVOIR","SCENE","SCIENCE","SEC","SECOND","SECRET","SEIZE","SELON","SEMAINE","SEMBLER","SENS","SENTIR","SEPT","SERIE","SERRER","SERVICE","SEUL","SEULE","SI","SIECLE","SIGNE","SILENCE","SIMPLE","SINON","SIX","SOCIETE","SOEUR","SOI","SOIF","SOIR","SOLEIL","SOL","SOMBRE","SOMME","SON","SONNER","SORT","SORTE","SORTIR","SOUCI","SOUFFLE","SOUFFRIR","SOUHAIT","SOULIER","SOURIRE","SOUS","SOUVENT","SUCCES","SUD","SUEUR","SUFFIRE","SUITE","SUIVRE","SUJET","SUR","SURTOUT","TABLE","TAILLE","TAIRE","TANDIS","TANT","TARD","TAS","TAUX","TEL","TELLE","TEMPS","TENDRE","TENIR","TENTER","TERME","TERRE","TETE","TEXTE","THEATRE","TIERS","TIRER","TITRE","TOI","TOIT","TOMBE","TOMBER","TON","TOTAL","TOUCHER","TOUJOURS","TOUR","TOURNER","TOUT","TOUTE","TRAIN","TRAIT","TRAVAIL","TRAVERS","TREIZE","TRENTE","TRES","TRESOR","TROIS","TRONC","TROP","TROU","TROUVER","TU","TUER","TYPE","UNIQUE","UNITE","USAGE","USER","VALEUR","VALLEE","VASE","VENDEUR","VENDRE","VENIR","VENT","VENTRE","VERRE","VERS","VERT","VERTU","VESTE","VETEMENT","VIDE","VIE","VIEUX","VIF","VILLAGE","VILLE","VIN","VINGT","VISAGE","VISITE","VITE","VIVRE","VOEU","VOI","VOIE","VOIR","VOISIN","VOITURE","VOIX","VOL","VOLER","VOLONTE","VOTRE","VOULOIR","VOUS","VOYAGE","VRAI","VUE","WAGON","YEUX","ZERO","ZONE"];

const editor = document.getElementById('noteEditor');
const dotsBtn = document.getElementById('dotsBtn');
const backBtn = document.getElementById('backBtn');
const anagramBtn = document.getElementById('anagramBtn');

let originalText = "";
let foundCandidates = [];
let timer;

function analyze() {
    const rawLines = editor.innerText.split('\n').filter(l => l.trim().length > 0);
    if (rawLines.length < 2) return;
    
    const sets = rawLines.map(l => new Set(l.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split('')));
    
    foundCandidates = DICTIONARY.filter(word => {
        const norm = word.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        if (norm.length !== rawLines.length) return false;
        for (let i = 0; i < norm.length; i++) if (!sets[i].has(norm[i])) return false;
        return true;
    });
    if (foundCandidates.length > 0) dotsBtn.classList.add('active');
}

function generateAnagramProgressive() {
    const words = editor.innerText.split(/[\n,]+/).map(w => w.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')).filter(w => w.length > 1);
    if (words.length < 2) return;

    originalText = editor.innerText;
    let anagramHTML = '<div class="reveals">';
    let currentPool = [...new Set(words)];
    let usedLetters = new Set();

    while (currentPool.length > 1 && usedLetters.size < 6) {
        let counts = {};
        currentPool.forEach(w => {
            new Set(w.split('')).forEach(l => { counts[l] = (counts[l] || 0) + 1; });
        });

        let bestLetter = Object.keys(counts).reduce((a, b) => 
            Math.abs(counts[a] - currentPool.length/2) < Math.abs(counts[b] - currentPool.length/2) ? a : b
        );

        if (!bestLetter || counts[bestLetter] === currentPool.length) break;

        usedLetters.add(bestLetter);
        let matching = currentPool.filter(w => w.includes(bestLetter));
        anagramHTML += `<div class="anagram-line"><span class="anagram-letter">${bestLetter}</span> - ${matching.join(', ')}</div>`;
        currentPool = matching.length > 0 ? matching : currentPool;
    }
    
    anagramHTML += '</div>';
    editor.innerHTML = anagramHTML;
}

editor.oninput = () => {
    dotsBtn.classList.remove('active');
    clearTimeout(timer);
    timer = setTimeout(analyze, 3000);
};

dotsBtn.onclick = () => {
    if (foundCandidates.length === 0) return;
    originalText = editor.innerText;
    editor.innerHTML = '<div class="reveals">' + foundCandidates.map(w => `<span class="replaced-word">${w}</span>`).join('') + '</div>';
    dotsBtn.classList.remove('active');
};

anagramBtn.onclick = generateAnagramProgressive;

backBtn.onclick = () => {
    if (originalText !== "") {
        let temp = editor.innerHTML;
        editor.innerText = originalText;
        originalText = ""; 
    }
};
</script>
</body>
</html>
