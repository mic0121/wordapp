<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg: #000; --s2: #1C1C1E; --txt: #FFFFFF; --txt-back: #FFD60A;
  --gris: #8E8E93;
  --verre: rgba(44,44,46,0.72);
  --verre-bord: rgba(255,255,255,0.10);
}
html, body { height: 100%; }
body { background: #000; display: flex; justify-content: center; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; overflow: hidden; height: 100vh; height: 100dvh; -webkit-font-smoothing: antialiased; }
.phone { width: 100%; max-width: 500px; height: 100%; background: var(--bg); position: relative; display: flex; flex-direction: column; }

/* Boutons « verre liquide » façon iOS 26 */
.verre {
  background: var(--verre);
  backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 0.5px solid var(--verre-bord);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 6px 18px rgba(0,0,0,0.35);
}
.verre:active { transform: scale(0.94); }

/* Barre du haut */
.navbar { padding: max(50px, calc(env(safe-area-inset-top) + 4px)) 16px 8px; display: flex; align-items: center; justify-content: space-between; z-index: 30; }
.nav-back-pill { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s; }
.nav-right-pill { display: flex; align-items: center; height: 44px; border-radius: 22px; padding: 0 6px; transition: transform .15s; }
.nav-ico { width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; }
.dots { display: flex; align-items: center; justify-content: center; gap: 3.5px; width: 40px; height: 44px; transition: 0.3s; }
.dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--txt); transition: background .3s; }
.dots.active .dot { background: var(--txt-back); }

/* Note */
.note-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 20px 280px; }
.note-date { text-align: center; color: var(--gris); font-size: 13px; font-weight: 500; margin: 2px 0 14px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.note-editor { width: 100%; min-height: 300px; font-size: 17px; line-height: 1.32; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--txt-back); white-space: pre-wrap; font-weight: 400; letter-spacing: -0.2px; }
.note-editor[contenteditable="true"]::first-line { font-size: 28px; font-weight: 700; letter-spacing: 0.2px; line-height: 1.25; }
.ana-line { display: block; margin-bottom: 2px; font-size: 21px; }
.ana-key { font-weight: 700; text-transform: uppercase; color: var(--txt-back); }
.ana-val { color: #828286; font-weight: 400; }
.ana-final { display: block; margin-top: 15px; font-weight: 600; color: #fff; font-size: 24px; text-transform: capitalize; border-top: 1px solid #333; padding-top: 10px; }
.replaced-word { font-size: 28px; font-weight: 800; color: var(--txt-back); text-transform: uppercase; display: block; margin-bottom: 12px; border-left: 3px solid var(--txt-back); padding-left: 15px; line-height: 1.2; }

/* Barre d'outils du bas */
.toolbar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 26px 16px calc(14px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to top, rgba(0,0,0,0.9) 40%, rgba(0,0,0,0)); pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.tb-pill { border-radius: 26px; height: 52px; padding: 0 8px; display: flex; align-items: center; transition: transform .15s; }
.tb-btn { width: 48px; height: 52px; display: flex; align-items: center; justify-content: center; }
.tb-icon { width: 23px; height: 23px; stroke: #FFF; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; }
.new-note-circle { border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s; }

/* Réglages cachés : appareil externe */
.sheet-bg { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg[hidden] { display: none; }
.sheet { width: 100%; max-width: 500px; background: #1C1C1E; border-radius: 14px 14px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); color: #fff; }
.sheet-grab { width: 36px; height: 5px; border-radius: 3px; background: #48484A; margin: 0 auto 14px; }
.sheet h3 { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 16px; }
.groupe { background: #2C2C2E; border-radius: 10px; overflow: hidden; }
.rang { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 6px 16px; font-size: 17px; }
.rang + .rang { border-top: 0.5px solid #3A3A3C; }
.rang input[type="text"] { flex: 1; min-width: 0; text-align: right; background: none; border: 0; outline: none; color: var(--gris); font: inherit; font-size: 16px; }
.interrupteur { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: #39393D; position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; }
.interrupteur::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.interrupteur:checked { background: #34C759; }
.interrupteur:checked::after { transform: translateX(20px); }
.indice { color: var(--gris); font-size: 13px; line-height: 1.4; padding: 8px 16px 18px; }
.sheet-btns { display: flex; gap: 10px; }
.sheet-btns button { flex: 1; height: 50px; border-radius: 12px; border: 0; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
.lien-api { flex: 1; min-width: 0; font-size: 13px; color: var(--gris); word-break: break-all; line-height: 1.35; -webkit-user-select: all; user-select: all; }
.copier { border: 0; background: none; color: var(--txt-back); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
#relayTest { background: #2C2C2E; color: var(--txt-back); }
#relayClose { background: var(--txt-back); color: #000; }
</style>
</head>

// Nettoyage strict des inputs (majuscules, pas d'accents, pas d'espaces)[cite: 1]
function normalize(str) { 
    return str.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z]/g, ''); 
}

editor.oninput = () => {
    const rawLines = editor.innerText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const lineCount = rawLines.length;

    // Liste de mots pour l'anagramme progressif : separee par n'importe quel espace
    // (barre d'espace OU retour a la ligne), donc jamais besoin d'appuyer sur Entree
    // pour qu'un mot compte - il est pris en compte des la derniere lettre tapee.
    const wordList = editor.innerText.trim().split(/\s+/).filter(w => w.length > 0);
    if (wordList.length >= 1) {
        ghostList = wordList;
        autoCalculateAnagram(ghostList);
    }

    if (lineCount >= 2) {
        const sets = rawLines.map(l => new Set(normalize(l).split('')));
        const currentCandidates = DICTIONARY.filter(word => {
            const norm = normalize(word);
            if (norm.length !== lineCount) return false;
            for (let i = 0; i < norm.length; i++) { 
                if (!sets[i].has(norm[i])) return false; 
            }
            return true;
        });

        // Affichage de jusqu'à 3 mots secrets possibles[cite: 1]
        if (currentCandidates.length > 0) { 
            ghostCandidates = currentCandidates.slice(0, 3); 
            dotsBtn.classList.add('active');
            if (lineCount >= vaultDictionary.lines) {
                vaultDictionary.word = ghostCandidates.join(' / ');
                vaultDictionary.lines = lineCount;
                relayWord(vaultDictionary.word);
            }
        } else {
            dotsBtn.classList.remove('active');
        }
    }
};

function autoCalculateAnagram(words) {
    let currentWords = [...words];
    const initialLineCount = currentWords.length;
    let usedLetters = new Set();
    let displayHTML = "";

    // Boucle de filtrage par lettres
    for (let i = 0; i < 15; i++) {
        let char = getBestLetter(currentWords, usedLetters);
        if (!char) break;
        usedLetters.add(char);
        let noWords = currentWords.filter(w => !normalize(w).includes(char));
        if (noWords.length > 0) {
            displayHTML += `<div class="ana-line"><span class="ana-key">${char} - </span><span class="ana-val">${noWords.map(w => w.toLowerCase()).join(', ')}</span></div>`;
            currentWords = currentWords.filter(w => normalize(w).includes(char));
        }
        if (currentWords.length <= 1) break;
    }
    
    // Solution ultime pour le dernier mot : On l'affiche toujours s'il reste un mot[cite: 1]
    if (currentWords.length > 0) {
        displayHTML += `<div class="ana-final">${currentWords[0]}</div>`;
    }
    
    if (initialLineCount >= vaultAnagram.lines) {
        vaultAnagram.html = displayHTML;
        vaultAnagram.lines = initialLineCount;
    }
}

function getBestLetter(wordList, usedLetters) {
    let counts = {};
    wordList.forEach(w => {
        let normW = normalize(w);
        let uniqueChars = new Set(normW.split(''));
        uniqueChars.forEach(c => { if (!usedLetters.has(c)) counts[c] = (counts[c] || 0) + 1; });
    });
    let bestChar = null; let minDiff = Infinity;
    for (let char in counts) {
        let noCount = wordList.filter(w => !normalize(w).includes(char)).length;
        if (noCount > 0 && noCount <= 2 && noCount < minDiff) { minDiff = noCount; bestChar = char; }
    }
    return bestChar || Object.keys(counts)[0];
}

newNoteBtn.onclick = () => {
    editor.innerHTML = "";
    editor.contentEditable = "true";
    ghostCandidates = [];
    ghostList = [];
    vaultDictionary = { word: "", lines: 0 };
    vaultAnagram = { html: "", lines: 0 };
    dotsBtn.classList.remove('active');
    editor.focus();
};

// ===== Date en haut de la note (comme dans Notes) =====
const noteDate = document.getElementById('noteDate');
function majDate() {
    const d = new Date();
    const jour = d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'long', year: 'numeric' });
    const heure = d.toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit', hour12: false }).replace(' h ', ':');
    noteDate.textContent = jour + ' à ' + heure;
}
majDate();

// ===== Appareil externe : envoi du mot trouvé via ntfy.sh =====
const RELAY_KEY = 'notagram-relay';
let relay = { on: false, topic: '' };
try { relay = Object.assign(relay, JSON.parse(localStorage.getItem(RELAY_KEY) || '{}')); } catch (e) {}
if (!relay.topic) relay.topic = 'ng-' + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8);
function saveRelay() { try { localStorage.setItem(RELAY_KEY, JSON.stringify(relay)); } catch (e) {} }
saveRelay();

let relayTimer = null, relayLast = '';
function sendRelay(text) {
    if (!relay.topic) return Promise.reject();
    return fetch('https://ntfy.sh/' + encodeURIComponent(relay.topic), { method: 'POST', body: text });
}
// Attend 1,5 s sans changement avant d'envoyer, pour ne pas envoyer chaque lettre
function relayWord(word) {
    if (!relay.on || !word) return;
    clearTimeout(relayTimer);
    relayTimer = setTimeout(() => {
        if (word === relayLast) return;
        relayLast = word;
        sendRelay(word).catch(() => { relayLast = ''; });
    }, 1500);
}
newNoteBtn.addEventListener('click', () => {
    relayLast = ''; clearTimeout(relayTimer); majDate();
    if (relay.on) sendRelay('-').catch(() => {});   // vide le mini écran
});
function lienApi() { return 'https://ntfy.sh/' + encodeURIComponent(relay.topic) + '/json?poll=1&since=latest'; }
backBtn.addEventListener('click', majDate);

// Réglages : appui long (0,8 s) sur la date
const sheet = document.getElementById('relaySheet');
const relayOn = document.getElementById('relayOn');
const relayTopic = document.getElementById('relayTopic');
const relayEcho = document.getElementById('relayTopicEcho');
const relayTest = document.getElementById('relayTest');
function ouvrirReglages() {
    relayOn.checked = relay.on; relayTopic.value = relay.topic; relayEcho.textContent = relay.topic; document.getElementById('relayUrl').textContent = lienApi();
    relayTest.textContent = 'Tester';
    sheet.hidden = false;
}
let pressTimer = null;
const debutAppui = (e) => { pressTimer = setTimeout(ouvrirReglages, 800); };
const finAppui = () => clearTimeout(pressTimer);
noteDate.addEventListener('touchstart', debutAppui, { passive: true });
noteDate.addEventListener('mousedown', debutAppui);
['touchend', 'touchmove', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => noteDate.addEventListener(ev, finAppui));

relayOn.onchange = () => { relay.on = relayOn.checked; saveRelay(); };
relayTopic.oninput = () => { relay.topic = relayTopic.value.trim().replace(/[^A-Za-z0-9_-]/g, ''); relayEcho.textContent = relay.topic; document.getElementById('relayUrl').textContent = lienApi(); saveRelay(); };
relayTest.onclick = () => {
    relayTest.textContent = 'Envoi…';
    sendRelay('Test Notagram ✓')
        .then(r => { relayTest.textContent = r.ok ? 'Envoyé ✓' : 'Échec'; })
        .catch(() => { relayTest.textContent = 'Échec'; });
};
document.getElementById('relayCopy').onclick = () => {
    const b = document.getElementById('relayCopy');
    const ok = () => { b.textContent = 'Copié ✓'; setTimeout(() => b.textContent = 'Copier', 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(lienApi()).then(ok).catch(() => {});
    else { const r = document.createRange(); r.selectNodeContents(document.getElementById('relayUrl')); getSelection().removeAllRanges(); getSelection().addRange(r); }
};
document.getElementById('relayClose').onclick = () => { sheet.hidden = true; };
sheet.onclick = (e) => { if (e.target === sheet) sheet.hidden = true; };
</script>
</body>
</html>
