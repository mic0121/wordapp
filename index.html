<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Notes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg: #000; --s2: #1C1C1E; --txt: #FFFFFF; --txt-back: #FFD60A; }
body { background: #000; display: flex; justify-content: center; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; }
.phone { width: 393px; height: 100%; background: var(--bg); position: relative; display: flex; flex-direction: column; }
.navbar { height: 95px; padding: 45px 16px 0; display: flex; align-items: center; justify-content: space-between; z-index: 30; }
.nav-back-pill { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.nav-back-text { font-size: 17px; color: var(--txt-back); }
.nav-right-pill { display: flex; align-items: center; gap: 12px; background: var(--s2); border-radius: 20px; padding: 6px 14px; }
.dots { display: flex; align-items: center; gap: 3.5px; cursor: pointer; padding: 5px; opacity: 0.2; transition: 0.3s; }
.dots.active { opacity: 1; }
.dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--txt); }
.dots.active .dot { background: var(--txt-back); }
.note-body { flex: 1; overflow-y: auto; padding: 10px 20px 280px; }
.note-editor { width: 100%; min-height: 300px; font-size: 21px; line-height: 1.6; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--txt-back); white-space: pre-wrap; font-weight: 500; }
.ana-line { display: block; margin-bottom: 2px; font-size: 21px; }
.ana-key { font-weight: 700; text-transform: uppercase; color: var(--txt-back); }
.ana-val { color: #828286; font-weight: 400; }
.ana-final { display: block; margin-top: 15px; font-weight: 600; color: #fff; font-size: 24px; text-transform: capitalize; border-top: 1px solid #333; padding-top: 10px; }
.replaced-word { font-size: 32px; font-weight: 800; color: var(--txt-back); text-transform: uppercase; display: block; margin-bottom: 12px; border-left: 3px solid var(--txt-back); padding-left: 15px; }
.toolbar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px 15px calc(70px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(25px); border-top: 0.3px solid rgba(255,255,255,0.15); }
.tb-pill { background: #1C1C1E; border-radius: 30px; padding: 10px 18px; display: flex; gap: 22px; border: 0.5px solid #333; align-items: center; }
.tb-icon { width: 22px; height: 22px; stroke: #FFF; fill: none; stroke-width: 1.6; cursor: pointer; }
.new-note-circle { background: #1C1C1E; border: 0.5px solid #333; border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="phone">
    <div class="navbar">
        <div class="nav-back-pill" id="backBtn"><svg width="10" height="16" viewBox="0 0 10 16"><path d="M9 1L1 8L9 15" stroke="#FFD60A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-back-text">Notes</span></div>
        <div class="nav-right-pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white"><path d="M12 15V3m-4 4l4-4 4 4M4 12v8h16v-8"/></svg><div id="dotsBtn" class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
    </div>
    <div class="note-body"><div class="note-editor" id="editor" contenteditable="true" spellcheck="false" placeholder="Note"></div></div>
    <div class="toolbar">
        <div class="tb-pill">
            <svg class="tb-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
            <svg class="tb-icon" id="anaBtn" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><rect x="2" y="4" width="14" height="14" rx="2"/></svg>
            <svg class="tb-icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <svg class="tb-icon" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        </div>
        <div class="new-note-circle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
    </div>
</div>

<script>
// Insérer ici le dictionnaire complet (DICTIONARY = [...])
const DICTIONARY = ["ABORD","ABRI","ACCES" /* ... etc ... */];

let ghostCandidates = []; 
let ghostList = [];      
let tempBuffer = []; // Stockage temporaire pendant que le spectateur écrit
let originalContent = "";

const editor = document.getElementById('editor');
const dotsBtn = document.getElementById('dotsBtn');
const anaBtn = document.getElementById('anaBtn');
const backBtn = document.getElementById('backBtn');

function normalize(str) { return str.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

editor.oninput = () => {
    const rawLines = editor.innerText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    
    if (rawLines.length > 0) {
        // Le spectateur écrit : on met à jour le buffer temporaire s'il écrit PLUS de lignes
        if (rawLines.length >= tempBuffer.length) {
            tempBuffer = [...rawLines];
        }
    } else {
        // LE CHAMP EST VIDE : Le spectateur a tout effacé. 
        // C'est le moment de verrouiller la mémoire !
        if (tempBuffer.length >= 1) {
            ghostList = [...tempBuffer];
            calculateDictionary(tempBuffer);
            tempBuffer = []; // On vide le buffer pour la prochaine fois
        }
    }
};

function calculateDictionary(lines) {
    if (lines.length < 2) return;
    const sets = lines.map(l => new Set(normalize(l).split('')));
    const currentCandidates = DICTIONARY.filter(word => {
        const norm = normalize(word);
        if (norm.length !== lines.length) return false;
        for (let i = 0; i < norm.length; i++) { if (!sets[i].has(norm[i])) return false; }
        return true;
    });

    if (currentCandidates.length > 0) { 
        ghostCandidates = currentCandidates; 
        dotsBtn.classList.add('active'); 
    }
}

function getBestLetter(wordList, usedLetters) {
    let counts = {};
    wordList.forEach(w => {
        let uniqueChars = new Set(normalize(w).split(''));
        uniqueChars.forEach(c => { if (!usedLetters.has(c)) counts[c] = (counts[c] || 0) + 1; });
    });
    let bestChar = null; let minDiff = Infinity;
    for (let char in counts) {
        let noCount = wordList.filter(w => !normalize(w).includes(char)).length;
        if (noCount > 0 && noCount <= 2 && noCount < minDiff) { minDiff = noCount; bestChar = char; }
    }
    return bestChar || Object.keys(counts)[0];
}

function runAnagram() {
    if (ghostList.length < 1) return;
    originalContent = editor.innerHTML;
    let currentWords = [...ghostList];
    let usedLetters = new Set();
    let displayHTML = "";

    for (let i = 0; i < 10; i++) {
        let char = getBestLetter(currentWords, usedLetters);
        if (!char) break;
        usedLetters.add(char);
        let noWords = currentWords.filter(w => !normalize(w).includes(char));
        if (noWords.length > 0) {
            displayHTML += `<div class="ana-line"><span class="ana-key">${char} - </span><span class="ana-val">${noWords.map(w => w.toLowerCase()).join(', ')}</span></div>`;
            currentWords = currentWords.filter(w => normalize(w).includes(char));
        }
        if (currentWords.length <= 1) break;
    }
    if (currentWords.length > 0) displayHTML += `<div class="ana-final">${currentWords[0].toLowerCase()}</div>`;
    editor.innerHTML = displayHTML;
    editor.contentEditable = "false";
}

dotsBtn.onclick = () => {
    if (ghostCandidates.length === 0) return;
    originalContent = editor.innerHTML;
    editor.innerHTML = ghostCandidates.slice(0, 3).map(w => `<span class="replaced-word">${w}</span>`).join('');
    editor.contentEditable = "false";
};

anaBtn.onclick = (e) => { e.preventDefault(); runAnagram(); };
backBtn.onclick = () => { editor.contentEditable = "true"; editor.innerHTML = ""; originalContent = ""; };
</script>
</body>
</html>
