<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Notes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg: #000; --s2: #1C1C1E; --txt: #FFFFFF; --txt-back: #FFD60A; }

html, body { height: 100%; background: #000; display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; overflow: hidden; }

.phone { width: 393px; height: 852px; background: var(--bg); border-radius: 54px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
@media (max-height: 870px) { .phone { height: 100vh; width: calc(100vh * 0.46); } }
@media (max-width: 420px) { .phone { width: 100vw; height: 100dvh; border-radius: 0; } }

/* Navbar */
.navbar { height: 95px; padding: 45px 12px 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 30; }
.nav-back-pill { display: flex; align-items: center; gap: 6px; background: var(--s2); border-radius: 20px; padding: 6px 12px; cursor: pointer; }
.nav-back-text { font-size: 17px; color: var(--txt-back); }

.nav-right-pill { display: flex; align-items: center; gap: 12px; background: var(--s2); border-radius: 20px; padding: 6px 14px; }
.dots { display: flex; align-items: center; gap: 3.5px; cursor: pointer; padding: 5px; }
.dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--txt); opacity: 0.2; transition: 0.3s; }
.dots.active .dot { background: var(--txt-back); opacity: 1; box-shadow: 0 0 8px var(--txt-back); }

/* Editor */
.note-body { flex: 1; overflow-y: auto; padding: 10px 20px 140px; }
.note-editor { width: 100%; min-height: 100%; font-size: 19px; line-height: 1.5; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--txt-back); white-space: pre-wrap; }

/* Styles Révélations */
.ana-line { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 0.5px solid #2c2c2e; }
.ana-letter { color: var(--txt-back); font-weight: 800; font-size: 26px; margin-right: 15px; }
.ana-info { color: #fff; font-size: 18px; }
.ana-sub { color: #666; font-size: 14px; margin-top: 4px; display: block; }
.replaced-word { font-size: 32px; font-weight: 800; color: var(--txt-back); text-transform: uppercase; display: block; margin-bottom: 12px; border-left: 3px solid var(--txt-back); padding-left: 15px; }

/* Toolbar */
.toolbar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 0 20px calc(8px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; }
.tb-pill { background: #1C1C1E; border-radius: 30px; padding: 12px 25px; display: flex; gap: 30px; border: 0.5px solid #333; }
.tb-icon { width: 24px; height: 24px; stroke: #FFF; fill: none; stroke-width: 1.8; cursor: pointer; }
</style>
</head>
<body>

<div class="phone">
    <div class="navbar">
        <div class="nav-back-pill" id="backBtn">
            <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M9 1L1 8L9 15" stroke="#FFD60A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-back-text">Notes</span>
        </div>
        <div class="nav-right-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 15V3m-4 4l4-4 4 4M4 12v8h16v-8"/></svg>
            <div style="width: 1px; height: 15px; background: rgba(255,255,255,0.1);"></div>
            <div id="dotsBtn" class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>
    </div>

    <div class="note-body">
        <div class="note-editor" id="editor" contenteditable="true" spellcheck="false"></div>
    </div>

    <div class="toolbar">
        <div class="tb-pill">
            <svg class="tb-icon" id="anaBtn" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><rect x="2" y="4" width="14" height="14" rx="2"/></svg>
            <svg class="tb-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 11-7.6-7.6 8.38 8.38 0 013.8.9L21 4.5v7z"/></svg>
        </div>
        <div style="background: #1C1C1E; border: 0.5px solid #333; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
    </div>
</div>

<script>
const DICTIONARY = ["DISQUE","ACTEUR","ARBRE","MAISON","COEUR","SOLEIL","NUAGE","ARGENT","AMOUR","BAGUE","VIANDE","MARIAGE","VAGUE","SIRENE","FLEUR","CHIEN","CHAT","ETOILE","LIVRE","BATEAU","CHEMIN","MONDE","JOUR","NUIT","FEMME","HOMME","ENFANT","PAPIER","ECOLE","TRAVAIL","FORME","BOUCHE","VISAGE","CORPS","BRAS","JAMBE","PIED","MAIN","DOIGT","OISEAU","POISSON","TERRE","PIERRE","SABLE","VENT","FEU","PLUIE","NEIGE","PROJET","ESPRIT","REVE","ESPOIR","FORCE","TEMPS","HEURE","MINUTE","CHAISE","TABLE","PORTE","FENETRE","CHAMBRE","CUISINE","REPAS","POMME","PAIN","EAU","VERRE","CAFE","THE","MUSIQUE","DANSE","CHANT","FILM","IMAGE","PHOTO","CADRE","MONTRE","BIJOU","CLEF","LAMPE","ROUGE","BLEU","VERT","JAUNE","BLANC","NOIR","GRIS","ROSE","VIOLET","ORANGE","FORTE","PETIT","GRAND","LARGE","COURT","LONG","LOURD","LEGER","CALME","BRUIT","CHAUD","FROID","DOUCE","AMIS","FRERE","SOEUR","PARENTS","FAMILLE","VOYAGE","VALISE","AVION","TRAIN","AUTO","ROUTE","VILLAGE","VILLE","PAYS","MER","LAC","FORET","HERBE","JARDIN","PLANTER","FERME","VACHE","CHEVAL","LOUP","OURS","SINGE","LAPIN","SOUCIS","JOIE","PEUR","COLERE","RIRE","PLEURER","CALME","VIVRE","MORT","VIE","SANTE","SANTE","SANG","PEAU","CHEVEUX","YEUX","NEZ","DENT","COI","MODE","STYL","SAC","GANTS","VESTE","ROBE","JUPE","BOTTE","HABIT","LINGE","TAPIS","LIT","REPOS","STRESS","CALME","LIBRE","DROIT","LOI","PAIX","GUERRE","SOLDAT","ARME","JEU","BALLE","SPORT","FOOT","TENNIS","VITESSE","COURIR","MARCHER","DANSER","SAUTER","NAGER","VOLER","MANGER","BOIRE","DORMIR","VOIR","LIRE","ECRIRE","PARLER","ECOUTER","PENSER","CROIRE","SAVOIR","VENIR","ALLER","PARTIR","RESTER","DONNER","PRENDRE","GARDER","PERDRE","GAGNER","CHERCHER","TROUVER","OUVRIR","FERMER","COUPER","CASSER","REPARER","CHOISIR","OFFRIR","AIDER","AIMER","HAIR","OUSER","DIRE","FAIRE","METTRE","TENIR","SORTIR","ENTRER","MORTEL","PROPRE","SALE","PLEIN","VIDE","RAPIDE","LENT","UTILE","FACILE","DUR","SIMPLE","COMPLEXE","ENTIER","PARTIE","CENTRE","COIN","HAUT","BAS","DROIT","GAUCHE","DEVANT","DERRIERE","DANS","SURS","SOUS","ENTRE","PRES","LOIN","AVANT","APRES","DEMAIN","HIER","MATIN","SOIR","MIDI","LUNE","CIEL","UNIVERS","ESPACE","ASTRE","PLANETE","VAPEUR","FLAMME","ORAGE","ECLAIR","BRIQUE","BETON","METAL","ACIER","ARGENT","BRONZE","PIECE","BILLET","BANQUE","CREDIT","ACHAT","VENTE","COUTER","PRIX","VALEUR","CADEAU","FETE","NOEL","CULTURE","HISTOIRE","DESTIN","HASARD","CHANCE","RISQUE","ECHEC","SUCCES","VICTOIRE","COMBAT","DRAPEAU","NATION","PEUPLE","CITOYEN","VOTE","REGION","NORD","SUD","EST","OUEST","GLACE","DESERT","SABLE","DUNES","CAVE","GRENIER","SALON","PISCINE","PONT","TUNNEL","MUSEE","HOTEL","THEATRE","CIRQUE","CLOWN","MAGIE","SECRET","ENIGME","OMRE","LUMIERE","RAYON","SONGE","SOUVENIR","ODORAT","GOUT","TOUCHER","OUIE","DOULEUR","MALADE","MEDECIN","HOPITAL","DROGUE","ALCOOL","TABAC","POISON","CHASSE","PECHE","FORET","PLANTE","RACINE","TRONC","FEUILLE","GRAINE","RECOLTE","SAISON","ETE","HIVER","PRINTEMP","AUTOMNE","NEVEU","NIECE","COUSIN","EPOUX","EPOUSE","VOISIN","CLIENT","BOSS","COUPLE","HUMAIN","DIVIN","ANGE","DIABLE","MONSTRE","GEANT","NAIN","FEERIE","SORCIER","DRAGON","ROBOT","PILOTE","MARIN","POETE","ARTISTE","PEINTRE","SCULPTE","ACTEUR","DESSIN","LIGNE","POINT","CERCLE","CARRE","ANGLE","CHIFFRE","NOMBRE","SOMME","TOTAL","RESTE","MOITIE","DOUBLE","TRIPLE","UNIQUE","EGAL","STRICT","LIBRE","SAGE","FOU","BEAU","LAID","VIEUX","JEUNE","NEUF","ANCIEN","CACHE","VISIBLE","CACHER","MONTRE","DOUX","AMER","SALEE","SUCREE","ACIDE","FRAIS","SEC","HUMIDE","DUR","MOU","SOUPLY","RAIDE","LOURD","LEGER","PETIT","MINCE","MINIM","SOMBRE","CLAIR","VIF","TERNE","PALE","DENSE","EPAIS","FIN","MOU","TENDRE","CALME","DOCILE","REBELLE","BRAVE","LACHE","FIER","HUMBLE","VIL","NOBLE","TRISTE","HEUREUX","GAI","MOROSE","SEVERE","GENTIL","MÉCHANT","DOUX","AMICAL","UNIQUE","DIVERS","RARE","COMMUN","PUBLIC","PRIVE","SOCIAL","MORAL","LEGAL","SACRE","PROFANE","MODERNE","ACTUEL","PASSÉ","FUTUR","PROCHE","FINAL","PREMIER","DERNIER","SANS","AVEC","PAR","POUR","CONTRE","MALGRE","SAUF","VERS","CHEZ","HORS","DURANT","PRIX","TAXE","FRAIS","COUT","DEBIT","PERTE","GAIN","PROFIE","ACTION","BOURSE","CHANGES","ORDRE","COURS","INDICE","CRASH","RISQUE","VALEUR","OFFRE","DEMANDE","CLIENT","ACHETEU","VENDEUR","METIER","EMPLOI","SALAIRE","PATRON","CADRE","EQUIPE","PROJET","BUT","CIBLE","PLAN","ETAPE","ORDRE","METHODE","OUTIL","MOYEN","OBJET","CHOSE","TRUC","MACHIN","GADGET","SENS","LOGIQ","IDEE","NOTION","MOT","TERME","NOM","TITRE","PAGE","VERSO","REVERSE","CARTE","INDEX","LISTE","BLOC","LIGNE","ZONE","ESPACE","TAILLE","VOLUME","MASSE","POIDS","GRANDEU","FORCE","VIGUEUR","PUISSAN","ENERGIE","FEU","CHALEUR","DEGRES","ONDE","SIGNAL","RADIO","ECRAN","CLAVIER","SOURIS","CODE","WEB","DATA","PUCE","DISK","CABLE","FIBRE","PRISE","VOLT","WATT","AMPERE","MOTEUR","ROUE","FREIN","PONT","COQUE","AILE","HELICE","VOILE","ANCRE","QUAI","PORT","PHARE","BOUEE","PONT","ROUTE","RUE","VOIE","PISTE","CANAL","GUE","PAS","SAUT","MARCHE","COURSE","TROT","GALOP","FLUX","REFLUX","VAGUE","MAREE","COURAN","BORD","RIVE","PLAGE","COTE","ILE","RECIF","ABIME","FOND","SURFACE","DESSUS","DESSOUS","COTE","ANGLE","FACE","PROFIL","DOS","VENTRE","TORSE","COEUR","POUMON","FOIE","REIN","OS","MUSCLE","NERF","CELLULE","ATOME","GRAIN","POUR","CONTRE","PARTOUT","ICI","LA","BAS","HAUT","LOIN","PRES","TARD","TOT","BIEN","MAL","MIEUX","PIRE","TROP","ASSEZ","PEU","TANT","PLUS","MOINS","TRES","FORT","VITE","LENT","VRAI","FAUX","NON","OUI","BREF"];

let originalText = "";
let foundCandidates = [];
let timer;
const editor = document.getElementById('editor');
const dotsBtn = document.getElementById('dotsBtn');
const anaBtn = document.getElementById('anaBtn');
const backBtn = document.getElementById('backBtn');

function analyze() {
    const rawLines = editor.innerText.split('\n').filter(l => l.trim().length > 0);
    if (rawLines.length < 2) return;
    const sets = rawLines.map(l => new Set(l.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split('')));
    
    foundCandidates = DICTIONARY.filter(word => {
        const norm = word.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        if (norm.length !== rawLines.length) return false;
        for (let i = 0; i < norm.length; i++) if (!sets[i].has(norm[i])) return false;
        return true;
    });
    if (foundCandidates.length > 0) dotsBtn.classList.add('active');
}

function runAnagram() {
    const raw = editor.innerText.trim();
    if (!raw) return;
    originalText = raw;
    const words = [...new Set(raw.split(/[\n,]+/).map(w => w.trim().toUpperCase()).filter(w => w.length > 1))];
    if (words.length < 2) return;

    let html = '<div style="padding-top:10px;">';
    let remaining = [...words];
    let safety = 0;

    while (remaining.length > 1 && safety < 12) {
        safety++;
        let counts = {};
        remaining.forEach(w => { [...new Set(w.split(''))].forEach(l => counts[l] = (counts[l] || 0) + 1); });
        let bestLetter = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
        let yes = remaining.filter(w => w.includes(bestLetter));
        let no = remaining.filter(w => !w.includes(bestLetter));

        if (no.length > 0) {
            html += `<div class="ana-line"><span class="ana-letter">${bestLetter}</span><span class="ana-info">Si OUI : (reste ${yes.length})</span><span class="ana-sub">Si NON : ${no.join(' / ')}</span></div>`;
            remaining = yes;
        } else {
            delete counts[bestLetter];
            if (Object.keys(counts).length === 0) break;
        }
    }
    if (remaining.length === 1) html += `<div style="font-size: 26px; font-weight: 800; color: var(--txt-back); margin-top:20px;">FINAL : ${remaining[0]}</div>`;
    editor.innerHTML = html;
    editor.contentEditable = "false";
}

editor.oninput = () => {
    dotsBtn.classList.remove('active');
    clearTimeout(timer);
    timer = setTimeout(analyze, 2000);
};

dotsBtn.onclick = () => {
    if (foundCandidates.length === 0) return;
    originalText = editor.innerText;
    const displayWords = foundCandidates.slice(0, 3);
    editor.innerHTML = '<div class="reveals">' + displayWords.map(w => `<span class="replaced-word">${w}</span>`).join('') + '</div>';
    editor.contentEditable = "false";
    dotsBtn.classList.remove('active');
};

anaBtn.onclick = runAnagram;

backBtn.onclick = () => {
    if (originalText !== "") {
        editor.contentEditable = "true";
        editor.innerHTML = ""; 
        editor.innerText = originalText;
        originalText = "";
    }
};
</script>
</body>
</html>
