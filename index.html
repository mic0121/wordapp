<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notes</title>
<style>
/* Styles de l'interface iPhone */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg: #000; --s1: #1C1C1E; --s2: #2C2C2E; --s3: #3A3A3C; --txt: #FFFFFF; --txt2: #8E8E93; --yellow: #FFD60A; --sep: rgba(255,255,255,0.1); }
html, body { height: 100%; background: #0a0a0a; display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; overflow: hidden; }
.phone { width: 393px; height: 852px; background: var(--bg); border-radius: 54px; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 0 0.5px #3a3a3a, 0 50px 100px rgba(0,0,0,0.9); }
@media (max-height: 870px) { .phone { height: calc(100vh - 20px); width: min(393px, calc((100vh - 20px) * 0.462)); } }
@media (max-width: 420px) { .phone { width: 100vw; height: 100dvh; border-radius: 0; } }
.island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 122px; height: 36px; background: #000; border-radius: 22px; border: 1px solid #1c1c1c; z-index: 40; }
.sbar { height: 58px; padding: 18px 26px 0; display: flex; align-items: center; justify-content: space-between; z-index: 20; }
.sbar-time { font-size: 15px; font-weight: 600; color: var(--txt); }
.navbar { height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
.nav-pill { display: flex; align-items: center; background: var(--s2); border-radius: 22px; padding: 6px 14px; gap: 14px; }
.nav-pill-btn { background: none; border: none; color: var(--txt); cursor: pointer; }
.dots { display: flex; align-items: center; gap: 3.5px; }
.dot { width: 4px; height: 4px; background: var(--txt); border-radius: 50%; }
.dot.off { opacity: 0; }
.nav-done { width: 34px; height: 34px; border-radius: 50%; background: var(--yellow); border: none; display: flex; align-items: center; justify-content: center; }
.note-body { flex: 1; overflow-y: auto; padding: 8px 20px; }
.note-editor { width: 100%; min-height: 100%; font-size: 17px; line-height: 1.65; color: var(--txt); outline: none; white-space: pre-wrap; }
.replaced-word { font-size: 30px; font-weight: 700; color: var(--yellow); }
.toolbar { height: 48px; background: #1a1a1a; border-top: 0.5px solid var(--sep); display: flex; align-items: center; justify-content: space-around; }
.setup-screen { position: absolute; inset: 0; background: #000; z-index: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
.setup-input { width: 100%; padding: 15px; background: var(--s1); border: 1.5px solid var(--s3); border-radius: 14px; color: #fff; margin-bottom: 15px; }
.setup-btn { width: 100%; padding: 16px; background: var(--yellow); border: none; border-radius: 14px; font-weight: 700; cursor: pointer; }
.modal-wrap { position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); display: none; align-items: flex-end; z-index: 300; }
.modal-wrap.open { display: flex; }
.modal-sheet { width: 100%; background: #1c1c1e; border-radius: 22px 22px 0 0; padding: 20px; color: white; max-height: 80%; overflow-y: auto; }
.cand { background: var(--s2); padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
.cand.sel { border-color: var(--yellow); }
</style>
</head>
<body>

<div class="phone">
    <div class="island"></div>
    <div class="sbar"><span class="sbar-time" id="sbarTime">00:00</span></div>

    <div class="navbar">
        <button class="nav-pill-btn" style="background:var(--s2); border-radius:50%; width:34px; height:34px;">✕</button>
        <div class="nav-pill">
            <button class="nav-pill-btn">↑</button>
            <div style="width:1px; height:15px; background:rgba(255,255,255,0.1)"></div>
            <button class="nav-pill-btn" id="dotsBtn">
                <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot off" id="dot3"></div></div>
            </button>
        </div>
        <button class="nav-done" id="btnDone">✓</button>
    </div>

    <div class="note-body"><div class="note-editor" id="noteEditor" contenteditable="true" spellcheck="false"></div></div>

    <div class="toolbar"><span>Aa</span><span>Check</span><span>Table</span><span>Clip</span><span id="btnKb">⌨</span></div>

    <div class="setup-screen" id="setupScreen">
        <h2 style="color:white; margin-bottom:10px;">Config Magic</h2>
        <p style="color:gray; text-align:center; font-size:13px; margin-bottom:20px;">Utilisez un token Hugging Face (gratuit) pour l'IA.</p>
        <input class="setup-input" id="apiKeyInput" type="password" placeholder="hf_...">
        <button class="setup-btn" id="setupBtn">Activer le tour</button>
    </div>

    <div class="modal-wrap" id="modalWrap">
        <div class="modal-sheet">
            <div id="modalBody"></div>
            <button class="setup-btn" id="chooseBtn" style="margin-top:15px;" disabled>Appliquer le mot</button>
        </div>
    </div>
</div>

<script>
// --- CONFIG ---
const WEBHOOK_URL = "https://11q.co/api/last/43"; 
const INACTIVITY_MS = 2500; 

let hfToken = localStorage.getItem('hf_token_user') || '';
let analysisResult = null;
let analysisRunning = false;
let selectedCand = null;
let timer;

const editor = document.getElementById('noteEditor');
const dot3 = document.getElementById('dot3');
const modalWrap = document.getElementById('modalWrap');

// --- SETUP ---
if (hfToken) document.getElementById('setupScreen').style.display = 'none';

document.getElementById('setupBtn').onclick = () => {
    const val = document.getElementById('apiKeyInput').value;
    if (val.startsWith('hf_')) {
        hfToken = val;
        localStorage.setItem('hf_token_user', val);
        document.getElementById('setupScreen').style.display = 'none';
    } else {
        alert("Token invalide. Il doit commencer par hf_");
    }
};

// --- LOGIQUE WEBHOOK ---
async function sendToWebhook(word) {
    if (!WEBHOOK_URL) return;
    try {
        await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lastWord: word })
        });
    } catch(e) { console.error("Webhook error", e); }
}

// --- LOGIQUE IA ---
function extractLetterSets(lines) {
    return lines.map(w => {
        const clean = w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
        return [...new Set((clean.match(/[A-Z]/g) || []))];
    });
}

async function runAnalysis() {
    const lines = editor.innerText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length < 2 || analysisRunning) return;

    analysisRunning = true;
    const sets = extractLetterSets(lines);
    const lastWord = lines[lines.length - 1];
    
    sendToWebhook(lastWord);

    const prompt = `Trouve un mot français de ${lines.length} lettres. Contraintes: ${sets.map((s,i)=>`Lettre ${i+1} dans [${s.join(',')}]`).join('; ')}. Réponds uniquement en JSON: {"candidates": [{"mot": "MOT", "confiance": "haute"}]}`;

    try {
        const resp = await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${hfToken}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ inputs: prompt })
        });
        const data = await resp.json();
        
        // Extraction du JSON depuis la réponse
        const text = data[0].generated_text.split('[/INST]')[1] || data[0].generated_text;
        const jsonMatch = text.match(/\{.*\}/s);
        if (jsonMatch) {
            analysisResult = JSON.parse(jsonMatch[0]);
            dot3.classList.remove('off'); 
        }
    } catch(e) { console.error("Erreur IA", e); }
    analysisRunning = false;
}

// --- EVENTS ---
editor.oninput = () => {
    dot3.classList.add('off');
    clearTimeout(timer);
    timer = setTimeout(runAnalysis, INACTIVITY_MS);
};

document.getElementById('dotsBtn').onclick = () => {
    if (!analysisResult) return;
    modalWrap.classList.add('open');
    renderModal();
};

function renderModal() {
    const body = document.getElementById('modalBody');
    body.innerHTML = '<h3 style="margin-bottom:15px;">Mots possibles</h3>' + analysisResult.candidates.map((c, i) => `
        <div class="cand" onclick="selectCand(${i}, this)">
            <strong>${c.mot}</strong> (${c.confiance})
        </div>
    `).join('');
}

window.selectCand = (idx, el) => {
    document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
    selectedCand = analysisResult.candidates[idx].mot;
    document.getElementById('chooseBtn').disabled = false;
};

document.getElementById('chooseBtn').onclick = () => {
    editor.innerHTML = `<span class="replaced-word">${selectedCand}</span>`;
    modalWrap.classList.remove('open');
    analysisResult = null;
    dot3.classList.add('off');
};

document.getElementById('btnDone').onclick = () => editor.blur();
document.getElementById('btnKb').onclick = () => editor.blur();
modalWrap.onclick = (e) => { if(e.target === modalWrap) modalWrap.classList.remove('open'); };

// Clock
setInterval(() => {
    const now = new Date();
    document.getElementById('sbarTime').innerText = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}, 1000);
</script>
</body>
</html>
