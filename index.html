<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Notes</title>
    <style>
        :root {
            --ios-orange: #ff9f0a;
            --ios-bg: #000000;
            --ios-gray: #8e8e93;
            --ios-sep: #38383a;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px 5px 10px;
        }

        .back-btn {
            color: var(--ios-orange);
            font-size: 17px;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .header-right {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .header-icon {
            width: 22px;
            height: 22px;
            fill: var(--ios-orange);
        }

        /* Editor */
        .note-body {
            flex: 1;
            padding: 15px 20px;
            font-size: 19px;
            line-height: 1.4;
            outline: none;
            overflow-y: auto;
            caret-color: var(--ios-orange);
            white-space: pre-wrap;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px calc(15px + env(safe-area-inset-bottom)) 25px;
            border-top: 0.5px solid var(--ios-sep);
            background: #161616;
        }

        .tool-svg {
            width: 24px;
            height: 24px;
            fill: var(--ios-orange);
        }

        .tool-svg.gray { fill: var(--ios-gray); }
    </style>
</head>
<body>

    <div class="header">
        <div class="back-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="#ff9f0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Notes</div>
        <div class="header-right">
            <svg class="header-icon" viewBox="0 0 24 24"><path d="M18 16.08C17.24 16.08 16.56 16.38 16.04 16.85L8.91 12.7C8.96 12.47 9 12.24 9 12C9 11.76 8.96 11.53 8.91 11.3L15.96 7.19C16.5 7.69 17.21 8 18 8C19.66 8 21 6.66 21 5C21 3.34 19.66 2 18 2C16.34 2 15 3.34 15 5C15 5.24 15.04 5.47 15.09 5.7L8.04 9.81C7.5 9.31 6.79 9 6 9C4.34 9 3 10.34 3 12C3 13.66 4.34 15 6 15C6.79 15 7.5 14.69 8.04 14.19L15.16 18.35C15.11 18.56 15.08 18.78 15.08 19C15.08 20.61 16.39 21.92 18 21.92C19.61 21.92 20.92 20.61 20.92 19C20.92 17.39 19.61 16.08 18 16.08Z"/></svg>
            <!-- TRIGGER DICTIONNAIRE -->
            <svg id="trigger-dict" class="header-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg>
        </div>
    </div>

    <div id="editor" class="note-body" contenteditable="true" spellcheck="false"></div>

    <div class="toolbar">
        <!-- TRIGGER ANAGRAMME -->
        <svg id="trigger-ana" class="tool-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        
        <svg class="tool-svg gray" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <svg class="tool-svg gray" viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.1-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-3.45.3-5 1V7c1.55-.7 3.3-.9 5-.9 1.2 0 2.4.15 3.5.5v11.9z"/></svg>
        <svg class="tool-svg gray" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
        <svg class="tool-svg gray" viewBox="0 0 24 24"><path d="M20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const btnDict = document.getElementById('trigger-dict');
        const btnAna = document.getElementById('trigger-ana');

        let bufferLignes = []; // Pour le dictionnaire
        let bufferAnagramme = ""; // Pour l'anagramme pur
        let secretWord = "";

        // Dictionnaire (Version courte pour test, à compléter)
        const dictionnaire = ["ABRICOT","BATEAU","CHATEAU","MENTAL","MAGIQUE","QUEBEC"];

        editor.oninput = () => {
            let content = editor.innerText.trim();
            if (content.length > 0) {
                // 1. Logique Dictionnaire (on garde les lignes pour les 3 points)
                bufferLignes = content.split('\n').filter(l => l.trim() !== "");
                
                // 2. Logique Anagramme (on stocke tout le texte brut)
                bufferAnagramme = content.replace(/\s/g, '').toUpperCase();

                // Calcul silencieux du mot secret
                secretWord = dictionnaire.find(word => {
                    if (word.length !== bufferLignes.length) return false;
                    return bufferLignes.every((line, i) => line.toUpperCase().includes(word[i]));
                }) || "";
            }
        };

        // FONCTION 1 : RÉVÉLATION DICTIONNAIRE (3 points en haut)
        btnDict.onclick = (e) => {
            e.preventDefault();
            if (secretWord) {
                editor.innerHTML = `<div style="color:var(--ios-orange); font-weight:bold; text-align:center; margin-top:60px; font-size:26px;">${secretWord}</div>`;
                editor.contentEditable = "false";
            }
        };

        // FONCTION 2 : ANAGRAMME PUR (Icône Liste en bas à gauche)
        btnAna.onclick = (e) => {
            e.preventDefault();
            if (bufferAnagramme) {
                // On mélange les lettres stockées dans le buffer
                let melange = bufferAnagramme.split('').sort(() => Math.random() - 0.5).join('');
                editor.innerHTML = `<div style="text-align:center; margin-top:60px; letter-spacing:8px; font-size:22px; font-weight:500;">${melange}</div>`;
                editor.contentEditable = "false";
            }
        };

        // Reset au clic sur l'écran après une révélation
        editor.onclick = () => {
            if (editor.contentEditable === "false") {
                editor.innerHTML = "";
                editor.contentEditable = "true";
                editor.focus();
            }
        };

        window.onload = () => editor.focus();
    </script>
</body>
</html>
