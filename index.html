<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Notes</title>
    <style>
        :root {
            --ios-yellow: #ffd60a;
            --ios-bg: #000000;
            --ios-secondary: #1c1c1e;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px 20px 10px 20px;
        }

        .back-btn {
            background: var(--ios-secondary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-right-group {
            background: var(--ios-secondary);
            border-radius: 25px;
            padding: 6px 16px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .icon-header { fill: white; width: 22px; height: 22px; cursor: pointer; }

        #editor {
            flex: 1;
            padding: 20px;
            font-size: 19px;
            line-height: 1.5;
            outline: none;
            caret-color: var(--ios-yellow);
            white-space: pre-wrap;
        }

        .toolbar-container {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .main-tools, .edit-btn { pointer-events: auto; }

        .main-tools {
            background: var(--ios-secondary);
            border-radius: 35px;
            padding: 12px 22px;
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .edit-btn {
            background: var(--ios-secondary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-icon { fill: white; width: 24px; height: 24px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="back-btn" id="btn-back">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="white"/></svg>
        </div>
        <div class="header-right-group">
            <svg class="icon-header" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            <svg class="icon-header" viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
    </div>

    <div id="editor" contenteditable="true" spellcheck="false"></div>

    <div class="toolbar-container">
        <div class="main-tools">
            <svg class="tool-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            <!-- L'icône appareil photo qui déclenche l'anagramme progressif -->
            <svg id="trigger-ana" class="tool-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <svg class="tool-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM8 20H4v-4h4v4zm0-6H4v-4h4v4zm0-6H4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4zm6 12h-4v-4h4v4zm0-6h-4v-4h4v4zm0-6h-4V4h4v4z"/></svg>
            <svg class="tool-icon" viewBox="0 0 24 24"><path d="M11 4.07V2.05c-2.01.2-3.84 1-5.32 2.21L7.1 5.69c1.11-.86 2.44-1.44 3.9-1.62zM7.1 18.31l-1.42 1.42c1.48 1.21 3.31 2.01 5.32 2.21v-2.02c-1.46-.18-2.79-.76-3.9-1.61zM18.31 7.1l1.42-1.42c-1.21-1.48-3.31-2.01-5.32-2.21v2.02c1.46.18 2.79.76 3.9 1.61zM11 21.95v-2.02c-1.46-.18-2.79-.76-3.9-1.61L5.68 19.74c1.48 1.21 3.31 2.01 5.32 2.21z"/></svg>
        </div>
        <div class="edit-btn">
            <svg class="tool-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const btnAna = document.getElementById('trigger-ana');
        const btnBack = document.getElementById('btn-back');

        let originalContent = "";
        let anaStep = 0;

        // On mémorise le contenu dès que l'utilisateur écrit
        editor.oninput = () => {
            originalContent = editor.innerText;
        };

        btnAna.onclick = (e) => {
            e.preventDefault();
            let lines = editor.innerText.split('\n').filter(l => l.trim() !== "");
            if (lines.length === 0) return;

            // Logique de l'anagramme progressif de 12h00
            let base = lines.map(l => l.trim()[0].toUpperCase()).join('');
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            
            let sequence = [
                base[0] || "?", 
                alphabet[Math.floor(Math.random() * 26)],
                base[Math.floor(base.length / 2)] || "X",
                alphabet[Math.floor(Math.random() * 26)],
                base[base.length - 1] || "!"
            ];

            if (anaStep < sequence.length) {
                showResult(sequence[anaStep]);
                anaStep++;
            } else {
                anaStep = 0;
            }
        };

        btnBack.onclick = () => {
            if (editor.contentEditable === "false") {
                editor.innerText = originalContent;
                editor.contentEditable = "true";
                anaStep = 0;
                editor.focus();
            }
        };

        function showResult(text) {
            editor.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100%; font-size:42px; color:white; font-weight:600; letter-spacing:8px; text-align:center;">${text}</div>`;
            editor.contentEditable = "false";
        }

        window.onload = () => editor.focus();
    </script>
</body>
</html>
