<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notes</title>
<style>
/* --- STYLES SYSTÈME --- */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
    --bg: #000;
    --s2: #1C1C1E; /* Fond des pilules */
    --txt: #FFFFFF;
    --txt-back: #FFD60A; /* Jaune Notes */
    --sep: rgba(255,255,255,0.1);
}
html, body {
    height: 100%; background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "SF Pro Text", sans-serif;
    overflow: hidden;
}

/* --- TÉLÉPHONE & STATUS BAR --- */
.phone {
    width: 393px; height: 852px; background: var(--bg);
    border-radius: 54px; overflow: hidden;
    position: relative; display: flex; flex-direction: column;
    box-shadow: 0 0 0 0.5px #3a3a3a, 0 50px 100px rgba(0,0,0,0.9);
}
@media (max-height: 870px) { .phone { height: calc(100vh - 20px); width: min(393px, calc((100vh - 20px) * 0.462)); } }
@media (max-width: 420px) { .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; } }

.island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 36px; background: #000; border-radius: 22px;
    border: 1px solid #1c1c1c; z-index: 40;
}
.sbar {
    height: 58px; padding: 18px 26px 0;
    display: flex; align-items: center; justify-content: flex-end; /* Juste les icônes à droite */
    flex-shrink: 0; z-index: 20; position: relative;
}
.sbar-icons { display: flex; align-items: center; gap: 6px; }

/* --- BARRE DE NAVIGATION (EN HAUT) --- */
.navbar {
    height: 52px; padding: 0 12px 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; z-index: 30;
}

/* Bouton Retour (Pilule Jaune) */
.nav-back-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--s2); border-radius: 22px;
    padding: 6px 14px 6px 10px; border: none; cursor: pointer;
}
.nav-back-chevron { width: 10px; height: 16px; stroke: var(--txt-back); stroke-width: 2.3; fill: none; }
.nav-back-text { font-size: 17px; font-weight: 500; color: var(--txt-back); }

/* Pilule Droite (Share & Dots) */
.nav-right-pill {
    display: flex; align-items: center; gap: 14px;
    background: var(--s2); border-radius: 22px;
    padding: 6px 14px; border: none;
}
.pill-icon-btn { background: none; border: none; cursor: pointer; color: var(--txt); padding: 0; }
.pill-div { width: 1px; height: 15px; background: rgba(255,255,255,0.15); }
.dots { display: flex; align-items: center; gap: 3.5px; }
.dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--txt); opacity: 0.3; /* Éteints par défaut */
    transition: background 0.3s, opacity 0.3s;
}
/* SIGNAL SECRET : Les points s'allument en jaune */
.dots.active .dot { background: var(--txt-back); opacity: 1; }

/* --- CORPS DE LA NOTE --- */
.note-body {
    flex: 1; overflow-y: auto;
    padding: 8px 20px 100px; /* Plus d'espace en bas pour la toolbar */
}
.note-editor {
    width: 100%; min-height: 100%;
    font-size: 17px; line-height: 1.65; color: var(--txt);
    background: transparent; border: none; outline: none;
    caret-color: var(--txt-back); white-space: pre-wrap;
}
.replaced-word {
    font-size: 32px; font-weight: 700; color: var(--txt-back);
    letter-spacing: -1px; text-transform: uppercase;
}

/* --- TOOLBAR (FLOTTANTE EN BAS) --- */
.toolbar-container {
    position: absolute; bottom: 20px; left: 0; width: 100%;
    padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 50; pointer-events: none; /* Laisse passer le clic en dehors des boutons */
}

/* Pilule Flottante de Gauche (Outils) */
.tb-main-pill {
    display: flex; align-items: center; gap: 20px;
    background: #232323; border-radius: 24px;
    padding: 10px 20px;
    pointer-events: auto; /* Active les clics */
}
.tb-icon-btn { background: none; border: none; cursor: pointer; color: var(--txt); padding: 0; }

/* Bouton Nouvelle Note (Séparé à Droite) */
.tb-new-btn-pill {
    background: #232323; border-radius: 50%; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; pointer-events: auto;
}

/* --- ÉCRAN DE CONFIGURATION --- */
.setup-screen {
    position: absolute; inset: 0; background: #000;
    z-index: 600; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 32px;
}
.setup-input {
    width: 100%; padding: 15px;
    background: #1C1C1E; border: 1.5px solid #3A3A3C;
    border-radius: 14px; color: #fff; font-family: monospace;
    margin-bottom: 12px; outline: none;
}
.setup-btn {
    width: 100%; padding: 16px;
    background: var(--txt-back); border: none; border-radius: 14px;
    font-size: 17px; font-weight: 700; color: #000; cursor: pointer;
}

/* --- MODAL DE RÉSULTAT --- */
.modal-wrap {
    position: absolute; inset: 0; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    z-index: 300; display: none; align-items: flex-end;
}
.modal-wrap.open { display: flex; }
.modal-sheet {
    width: 100%; background: #1c1c1e;
    border-radius: 22px 22px 0 0; padding: 20px; color: white;
    max-height: 80%; overflow-y: auto;
}
.cand {
    background: #2C2C2E; border-radius: 14px;
    padding: 14px; margin-bottom: 10px; cursor: pointer;
    border: 1.5px solid transparent;
}
.cand.sel { border-color: var(--txt-back); background: rgba(255,214,10,0.05); }
</style>
</head>
<body>

<div class="phone">
    <div class="island"></div>
    <div class="sbar">
        <div class="sbar-icons">
            <svg width="17" height="12" viewBox="0 0 17 12"><path d="M0 8h3v4H0zm4.5-2.5h3V12h-3zm4.5-2.5h3V12h-3zm4.5-3h3V12h-3z" fill="white"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><circle cx="8" cy="11" r="1.4" fill="white"/><path d="M4.8 7.8A4.5 4.5 0 018 6.5a4.5 4.5 0 013.2 1.3l1-1A6 6 0 008 5a6 6 0 00-4.2 1.8zM2.3 5.3A7.5 7.5 0 018 3a7.5 7.5 0 015.7 2.3l1-1A9 9 0 008 1.5 9 9 0 001.3 4.3z" fill="white" opacity=".5"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y="1.5" width="20" height="9" rx="2.5" stroke="white" stroke-width="1.2" fill="none" opacity=".45"/><rect x="2" y="3" width="13" height="6" rx="1.5" fill="white"/></svg>
        </div>
    </div>

    <div class="navbar">
        <button class="nav-back-pill">
            <svg class="nav-back-chevron" viewBox="0 0 10 16" fill="none"><path d="M9 1L1 8L9 15"/></svg>
            <span class="nav-back-text">Notes</span>
        </button>
        <div class="nav-right-pill">
            <button class="pill-icon-btn">
                <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="1.7"><path d="M10 13V3M6 7l4-4 4 4"/><path d="M4 11v6h12v-6"/></svg>
            </button>
            <div class="pill-div"></div>
            <button class="pill-icon-btn" id="dotsBtn">
                <div class="dots" id="secretDots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </button>
        </div>
    </div>

    <div class="note-body"><div class="note-editor" id="noteEditor" contenteditable="true" spellcheck="false"></div></div>

    <div class="toolbar-container">
        <div class="tb-main-pill">
            <button class="tb-icon-btn">
                <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h14M4 11h14M4 16h9"/><circle cx="18" cy="16" r="3.5"/><path d="M16.5 16l1 1 1.5-1.5"/></svg>
            </button>
            <button class="tb-icon-btn">
                <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17.5 11.5l-7.5 7.5a5 5 0 01-7-7L10 5a3.5 3.5 0 015 5L8.5 16.5a2 2 0 01-3-3L12 7"/></svg>
            </button>
            <button class="tb-icon-btn">
                <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="M8 11h.01M11 8v6M14 11h.01"/></svg>
            </button>
            <button class="tb-icon-btn">
                <svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="16" height="16" rx="2"/><line x1="3" y1="9" x2="19" y2="9"/><line x1="11" y1="3" x2="11" y2="19"/></svg>
            </button>
        </div>
        <button class="tb-new-btn-pill">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
    </div>

    <div class="setup-screen" id="setupScreen">
        <h2 style="color:white; margin-bottom:12px;">Configuration</h2>
        <input class="setup-input" id="apiKeyInput" type="password" placeholder="Token Hugging Face (hf_...)">
        <button class="setup-btn" id="setupBtn">Activer le tour</button>
    </div>

    <div class="modal-wrap" id="modalWrap">
        <div class="modal-sheet">
            <h3 style="margin-bottom:15px;">Mots possibles</h3>
            <div id="modalBody"></div>
            <button class="setup-btn" id="chooseBtn" style="margin-top:15px;" disabled>Révéler ce mot</button>
        </div>
    </div>
</div>

<script>
// --- CONFIGURATION ---
const WEBHOOK_URL = ""; // Enlevé pour le moment
const INACTIVITY_MS = 2500; 

let hfToken = localStorage.getItem('hf_token_notes_v2') || '';
let analysisResult = null;
let analysisRunning = false;
let selectedCand = null;
let timer;

const editor = document.getElementById('noteEditor');
const secretDots = document.getElementById('secretDots');
const modalWrap = document.getElementById('modalWrap');

if (hfToken) document.getElementById('setupScreen').style.display = 'none';

document.getElementById('setupBtn').onclick = () => {
    const val = document.getElementById('apiKeyInput').value;
    if (val.startsWith('hf_')) {
        hfToken = val;
        localStorage.setItem('hf_token_notes_v2', val);
        document.getElementById('setupScreen').style.display = 'none';
    } else {
        alert("Token invalide. Il doit commencer par hf_");
    }
};

async function sendToWebhook(word) {
    if (!WEBHOOK_URL) return;
    try {
        await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lastWord: word })
        });
    } catch(e) {}
}

function extractLetterSets(lines) {
    return lines.map(w => {
        const clean = w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
        return [...new Set((clean.match(/[A-Z]/g) || []))];
    });
}

async function runAnalysis() {
    const lines = editor.innerText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length < 2 || analysisRunning) return;

    analysisRunning = true;
    const sets = extractLetterSets(lines);
    
    sendToWebhook(lines[lines.length - 1]);

    const prompt = `Trouve un mot français de ${lines.length} lettres.
    Contraintes (chaque lettre du mot secret doit être dans le mot correspondant) :
    ${sets.map((s,i)=>`Lettre ${i+1} parmi: [${s.join(',')}]`).join('; ')}
    Réponds uniquement en JSON: {"candidates": [{"mot": "MOT", "confiance": "haute"}]}`;

    try {
        const resp = await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${hfToken}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ inputs: prompt })
        });
        const data = await resp.json();
        
        const text = data[0].generated_text.split('[/INST]')[1] || data[0].generated_text;
        const jsonMatch = text.match(/\{.*\}/s);
        if (jsonMatch) {
            analysisResult = JSON.parse(jsonMatch[0]);
            // SIGNAL SECRET : La classe 'active' rend les points jaunes et lumineux
            secretDots.classList.add('active'); 
        }
    } catch(e) { console.error("Erreur IA", e); }
    analysisRunning = false;
}

editor.oninput = () => {
    // Éteint le signal secret dès que l'utilisateur écrit
    secretDots.classList.remove('active'); 
    clearTimeout(timer);
    timer = setTimeout(runAnalysis, INACTIVITY_MS);
};

document.getElementById('dotsBtn').onclick = () => {
    if (!analysisResult) return;
    modalWrap.classList.add('open');
    renderModal();
};

function renderModal() {
    const body = document.getElementById('modalBody');
    body.innerHTML = analysisResult.candidates.map((c, i) => `
        <div class="cand" onclick="selectCand(${i}, this)">
            <div style="font-size:22px; font-weight:700; text-transform:uppercase;">${c.mot}</div>
            <div style="font-size:11px; color:gray; margin-top:4px;">Confiance: ${c.confiance}</div>
        </div>
    `).join('');
}

window.selectCand = (idx, el) => {
    document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
    selectedCand = analysisResult.candidates[idx].mot;
    document.getElementById('chooseBtn').disabled = false;
};

document.getElementById('chooseBtn').onclick = () => {
    // Le mot secret prend toute la place
    editor.innerHTML = `<span class="replaced-word">${selectedCand}</span>`;
    modalWrap.classList.remove('open');
    analysisResult = null;
    secretDots.classList.remove('active');
};

modalWrap.onclick = (e) => { if(e.target === modalWrap) modalWrap.classList.remove('open'); };
</script>
</body>
</html>
