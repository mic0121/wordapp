<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root { --bg: #000; --s2: #1C1C1E; --txt: #FFFFFF; --txt-back: #FFD60A; }
    body { background: #000; display: flex; justify-content: center; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; }
    .phone { width: 393px; height: 100%; background: var(--bg); position: relative; display: flex; flex-direction: column; }
    .navbar { height: 95px; padding: 45px 16px 0; display: flex; align-items: center; justify-content: space-between; z-index: 30; }
    .nav-back-pill { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .nav-back-text { font-size: 17px; color: var(--txt-back); }
    .nav-right-pill { display: flex; align-items: center; gap: 12px; background: var(--s2); border-radius: 20px; padding: 6px 14px; }
    .dots { display: flex; align-items: center; gap: 3.5px; cursor: pointer; padding: 5px; opacity: 0.2; transition: 0.3s; }
    .dots.active { opacity: 1; }
    .dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--txt); }
    .dots.active .dot { background: var(--txt-back); }
    .note-body { flex: 1; overflow-y: auto; padding: 10px 20px 280px; }
    .note-editor { width: 100%; min-height: 300px; font-size: 21px; line-height: 1.6; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--txt-back); white-space: pre-wrap; font-weight: 500; }
    .ana-line { display: block; margin-bottom: 4px; font-size: 20px; }
    .ana-key { font-weight: 700; text-transform: uppercase; color: var(--txt-back); }
    .ana-val { color: #828286; font-weight: 400; }
    .ana-final { display: block; margin-top: 15px; font-weight: 700; color: #fff; font-size: 26px; text-transform: uppercase; border-top: 1px solid #333; padding-top: 12px; letter-spacing: 1px; }
    .replaced-word { font-size: 32px; font-weight: 800; color: var(--txt-back); text-transform: uppercase; display: block; margin-bottom: 12px; border-left: 3px solid var(--txt-back); padding-left: 15px; }
    .toolbar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px 15px calc(70px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(25px); border-top: 0.3px solid rgba(255,255,255,0.15); }
    .tb-pill { background: #1C1C1E; border-radius: 30px; padding: 10px 18px; display: flex; gap: 22px; border: 0.5px solid #333; align-items: center; }
    .tb-icon { width: 22px; height: 22px; stroke: #FFF; fill: none; stroke-width: 1.6; cursor: pointer; }
    .new-note-circle { background: #1C1C1E; border: 0.5px solid #333; border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; }

let ghostDicoCandidates = []; 
let ghostNoteList = [];      

const editor = document.getElementById('editor');
const dotsBtn = document.getElementById('dotsBtn');
const anaBtn = document.getElementById('anaBtn');
const backBtn = document.getElementById('backBtn');

function normalize(str) { 
    return str.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); 
}

// --- LOGIQUE DE SAISIE ---
editor.oninput = () => {
    const rawLines = editor.innerText.split('\n').filter(l => l.trim() !== "");
    
    if (rawLines.length > 0) {
        ghostNoteList = [...rawLines]; // On garde toujours une trace
        
        // Comparaison caractère par caractère (Dictionnaire Invisible)
        const sets = rawLines.map(l => new Set(normalize(l).split('')));
        const matches = DICTIONARY.filter(word => {
            const nWord = normalize(word);
            if (nWord.length !== rawLines.length) return false;
            for (let i = 0; i < nWord.length; i++) {
                if (!sets[i].has(nWord[i])) return false;
            }
            return true;
        });

        if (matches.length > 0) {
            ghostDicoCandidates = matches;
            dotsBtn.classList.add('active');
        } else {
            dotsBtn.classList.remove('active');
            ghostDicoCandidates = [];
        }
    }
};

// --- LOGIQUE ANAGRAMME ---
function getBetterLetter(list, used) {
    let counts = {};
    list.forEach(w => {
        new Set(normalize(w).split('')).forEach(l => { if(!used.has(l)) counts[l] = (counts[l]||0) + 1; });
    });
    // On cherche une lettre qui divise la liste
    return Object.keys(counts).find(l => counts[l] > 0 && counts[l] < list.length);
}

function runAnagram() {
    // Si l'éditeur est vide, on prend la liste fantôme
    const currentLines = editor.innerText.split('\n').filter(l => l.trim() !== "");
    const listToProcess = (currentLines.length > 0) ? currentLines : ghostNoteList;

    if (listToProcess.length < 1) return;

    let candidates = [...listToProcess];
    let usedLetters = new Set();
    let html = "";
   // ... (code existant dans runAnagram)
    // Affichage du mot final
    if (candidates.length > 0) {
        const motFinal = candidates[0].toLowerCase();
        html += `<div class="ana-final">${motFinal}</div>`;
        
        // --- AJOUT : SAUVEGARDE DE L'ANAGRAMME ---
        localStorage.setItem('dernier_anagramme', motFinal);
    }
// ...
    // On boucle tant qu'il reste plus d'un candidat
    while (candidates.length > 1) {
        let char = getBetterLetter(candidates, usedLetters);
        if (!char) break;
        usedLetters.add(char);

        // On élimine ceux qui n'ont pas la lettre
        let failures = candidates.filter(w => !normalize(w).includes(char));
        if (failures.length > 0) {
            html += `<div class="ana-line"><span class="ana-key">${char} - </span><span class="ana-val">${failures.map(w => w.toLowerCase()).join(', ')}</span></div>`;
            candidates = candidates.filter(w => normalize(w).includes(char));
        }
    }

    // Affichage du mot final
    if (candidates.length > 0) {
        html += `<div class="ana-final">${candidates[0].toLowerCase()}</div>`;
    }
    
    editor.innerHTML = html;
    editor.contentEditable = "false";
}

// --- BOUTONS ---
dotsBtn.onclick = () => {
    if (ghostDicoCandidates.length === 0) return;
    // On affiche les 3 premières options du dictionnaire
    editor.innerHTML = ghostDicoCandidates.slice(0, 3).map(w => `<span class="replaced-word">${w}</span>`).join('');
    editor.contentEditable = "false";
dotsBtn.onclick = () => {
    if (ghostDicoCandidates.length === 0) return;
    
    // --- AJOUT : SAUVEGARDE DU MOT DICO ---
    const motSecret = ghostDicoCandidates[0];
    localStorage.setItem('mot_secret_dico', motSecret);

    editor.innerHTML = ghostDicoCandidates.slice(0, 3).map(w => `<span class="replaced-word">${w}</span>`).join('');
    editor.contentEditable = "false";
};

anaBtn.onclick = (e) => { 
    e.preventDefault(); 
    runAnagram(); 
};

backBtn.onclick = () => { 
    editor.contentEditable = "true"; 
    editor.innerHTML = ""; 
    editor.focus();
    dotsBtn.classList.remove('active');
};
// Ce bloc va TOUT À LA FIN
backBtn.ondblclick = () => {
    const ana = localStorage.getItem('dernier_anagramme') || "Aucun";
    const secret = localStorage.getItem('mot_secret_dico') || "Aucun";
    
    alert(`MÉMOIRE :\nAnagramme : ${ana}\nMot Secret : ${secret}`);
