<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Notes</title>
    <style>
        :root {
            --ios-yellow: #ffd60a;
            --ios-bg: #000000;
            --ios-secondary: #1c1c1e;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Design exact IMG_1991 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px 20px 10px 20px;
        }

        .back-btn {
            background: var(--ios-secondary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-right-group {
            background: var(--ios-secondary);
            border-radius: 25px;
            padding: 6px 16px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .icon-header { fill: white; width: 22px; height: 22px; transition: fill 0.3s; }
        .icon-header.active { fill: var(--ios-yellow); }

        #editor {
            flex: 1;
            padding: 20px;
            font-size: 19px;
            line-height: 1.5;
            outline: none;
            caret-color: var(--ios-yellow);
            white-space: pre-wrap;
        }

        .toolbar-container {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .main-tools, .edit-btn { pointer-events: auto; }

        .main-tools {
            background: var(--ios-secondary);
            border-radius: 35px;
            padding: 12px 22px;
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .edit-btn {
            background: var(--ios-secondary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-icon { fill: white; width: 24px; height: 24px; }
    </style>
</head>

        const dictionnaire = rawMots.split(',').map(m => m.trim().toUpperCase());

        editor.oninput = () => {
            originalContent = editor.innerText;
            let lines = originalContent.split('\n').filter(l => l.trim() !== "");
            
            let found = dictionnaire.find(word => {
                if (word.length !== lines.length) return false;
                return lines.every((line, i) => line.toUpperCase().includes(word[i]));
            });

            if (found) {
                secretWord = found;
                dots.classList.add('active');
            } else {
                dots.classList.remove('active');
                secretWord = "";
            }
        };

        // ANAGRAMME PROGRESSIF
        btnAna.onclick = (e) => {
            e.preventDefault();
            if (!secretWord) return;

            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const lettersInSecret = secretWord.split('');
            const others = alphabet.split('').filter(l => !lettersInSecret.includes(l));
            
            let sequence = [
                lettersInSecret[0], 
                others[Math.floor(Math.random() * others.length)],
                lettersInSecret[Math.floor(lettersInSecret.length / 2)],
                others[Math.floor(Math.random() * others.length)],
                lettersInSecret[lettersInSecret.length - 1]
            ];

            if (anaStep < sequence.length) {
                showResult(sequence[anaStep], false);
                anaStep++;
            } else {
                anaStep = 0;
            }
        };

        dots.onclick = (e) => {
            e.preventDefault();
            if (secretWord) showResult(secretWord, true);
        };

        // NAVIGATION BACK
        btnBack.onclick = () => {
            if (editor.contentEditable === "false") {
                editor.innerText = originalContent;
                editor.contentEditable = "true";
                anaStep = 0;
                editor.focus();
            }
        };

        function showResult(text, isSecret) {
            const color = isSecret ? 'var(--ios-yellow)' : 'white';
            editor.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100%; font-size:42px; color:${color}; font-weight:600; letter-spacing:8px; text-align:center;">${text}</div>`;
            editor.contentEditable = "false";
        }

        window.onload = () => editor.focus();
    </script>
