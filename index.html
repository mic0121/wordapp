<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg: #000; --s2: #1C1C1E; --txt: #FFFFFF; --txt-back: #FFD60A; }
html, body { height: 100%; background: #000; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }

.phone { width: 393px; height: 852px; background: var(--bg); border-radius: 54px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
@media (max-height: 870px) { .phone { height: calc(100vh - 10px); width: min(393px, calc((100vh - 10px) * 0.46)); } }
@media (max-width: 420px) { .phone { width: 100vw; height: 100dvh; border-radius: 0; } }

.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; border: 1px solid #1a1a1a; z-index: 100; }
.sbar { height: 50px; z-index: 20; }

.navbar { height: 52px; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 30; }
.nav-back-pill { display: flex; align-items: center; gap: 6px; background: var(--s2); border-radius: 20px; padding: 6px 12px 6px 8px; border: none; }
.nav-back-text { font-size: 17px; color: var(--txt-back); }
.nav-right-pill { display: flex; align-items: center; gap: 12px; background: var(--s2); border-radius: 20px; padding: 6px 14px; border: none; }
.pill-icon-btn { background: none; border: none; color: var(--txt); cursor: pointer; display: flex; align-items: center; }
.pill-div { width: 1px; height: 15px; background: rgba(255,255,255,0.1); }
.dots { display: flex; align-items: center; gap: 3.5px; }
.dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--txt); opacity: 0.3; transition: 0.3s; }
.dots.active .dot { background: var(--txt-back); opacity: 1; box-shadow: 0 0 8px var(--txt-back); }

.note-body { flex: 1; overflow-y: auto; padding: 10px 20px 150px; }
.note-editor { width: 100%; min-height: 100%; font-size: 18px; line-height: 1.6; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--txt-back); white-space: pre-wrap; }
.replaced-word { font-size: 36px; font-weight: 800; color: var(--txt-back); text-transform: uppercase; letter-spacing: -1px; }

.toolbar-container { position: absolute; bottom: 25px; left: 0; width: 100%; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; z-index: 50; pointer-events: none; }
.tb-main-pill { display: flex; align-items: center; gap: 22px; background: #252525; border-radius: 25px; padding: 10px 22px; pointer-events: auto; }
.tb-icon-svg { width: 22px; height: 22px; stroke: white; stroke-width: 1.6; fill: none; opacity: 0.9; }
.tb-new-btn { background: #252525; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border: none; pointer-events: auto; }

.setup-screen { position: absolute; inset: 0; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
.setup-input { width: 100%; padding: 16px; background: #1C1C1E; border: 1px solid #3A3A3C; border-radius: 12px; color: #fff; margin-bottom: 15px; outline: none; font-family: monospace; }
.setup-btn { width: 100%; padding: 16px; background: var(--txt-back); border: none; border-radius: 12px; font-weight: 700; font-size: 17px; cursor: pointer; }

.modal-wrap { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 500; display: none; align-items: flex-end; }
.modal-wrap.open { display: flex; }
.modal-sheet { width: 100%; background: #1c1c1e; border-radius: 20px 20px 0 0; padding: 25px; }
.cand { background: #2C2C2E; border-radius: 12px; padding: 18px; margin-bottom: 12px; cursor: pointer; border: 2px solid transparent; }
.cand.sel { border-color: var(--txt-back); background: #3a3a3c; }
</style>
</head>
<body>

<div class="phone">
    <div class="island"></div>
    <div class="sbar"></div>

    <div class="navbar">
        <div class="nav-back-pill"><svg width="10" height="16" viewBox="0 0 10 16"><path d="M9 1L1 8L9 15" stroke="#FFD60A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-back-text">Notes</span></div>
        <div class="nav-right-pill">
            <div class="pill-icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 15V3m-4 4l4-4 4 4M4 12v8h16v-8"/></svg></div>
            <div class="pill-div"></div>
            <div class="pill-icon-btn" id="dotsBtn">
                <div class="dots" id="secretDots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
        </div>
    </div>

    <div class="note-body"><div class="note-editor" id="noteEditor" contenteditable="true" spellcheck="false"></div></div>

    <div class="toolbar-container">
        <div class="tb-main-pill">
            <svg class="tb-icon-svg" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><rect x="2" y="4" width="14" height="14" rx="2"/></svg>
            <svg class="tb-icon-svg" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            <svg class="tb-icon-svg" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
            <svg class="tb-icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        </div>
        <div class="tb-new-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5l3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
    </div>

    <div class="setup-screen" id="setupScreen">
        <h2 style="color:white; margin-bottom:8px;">Configuration</h2>
        <input class="setup-input" id="apiKeyInput" type="password" placeholder="hf_...">
        <button class="setup-btn" id="setupBtn">Activer</button>
    </div>

    <div class="modal-wrap" id="modalWrap">
        <div class="modal-sheet">
            <h3 style="color:white; margin-bottom:20px;">Choix du mot</h3>
            <div id="modalBody"></div>
            <button class="setup-btn" id="chooseBtn" style="margin-top:10px;" disabled>Révéler</button>
        </div>
    </div>
</div>

<script>
const INACTIVITY_MS = 10000; 
let hfToken = localStorage.getItem('hf_token_magic_v5') || '';
let analysisResult = null;
let analysisRunning = false;
let selectedCand = null;
let timer;

const editor = document.getElementById('noteEditor');
const secretDots = document.getElementById('secretDots');
const modalWrap = document.getElementById('modalWrap');

if (hfToken) document.getElementById('setupScreen').style.display = 'none';

document.getElementById('setupBtn').onclick = () => {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (val.startsWith('hf_')) {
        hfToken = val;
        localStorage.setItem('hf_token_magic_v5', val);
        document.getElementById('setupScreen').style.display = 'none';
    }
};

function extractLetterSets(lines) {
    return lines.map(w => {
        const clean = w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
        return [...new Set((clean.match(/[A-Z]/g) || []))];
    });
}

async function runAnalysis() {
    const lines = editor.innerText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length < 2 || analysisRunning) return;
    
    analysisRunning = true;
    const sets = extractLetterSets(lines);

    const prompt = `Trouve un mot français de ${lines.length} lettres. Chaque lettre i doit être dans: ${sets.map((s,i) => `ligne${i+1}:[${s.join('')}]`).join(', ')}. Réponds en JSON: {"candidates":[{"mot":"MOT"}]}`;

    try {
        const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3", {
            headers: { Authorization: `Bearer ${hfToken}`, "Content-Type": "application/json" },
            method: "POST",
            body: JSON.stringify({ inputs: prompt, parameters: { return_full_text: false } }),
        });
        const result = await response.json();
        const jsonMatch = result[0].generated_text.match(/\{.*\}/s);
        if (jsonMatch) {
            analysisResult = JSON.parse(jsonMatch[0]);
            secretDots.classList.add('active'); 
        }
    } catch (e) { console.error(e); }
    analysisRunning = false;
}

editor.oninput = () => {
    secretDots.classList.remove('active');
    clearTimeout(timer);
    timer = setTimeout(runAnalysis, INACTIVITY_MS);
};

document.getElementById('dotsBtn').onclick = () => {
    if (!analysisResult) return;
    modalWrap.classList.add('open');
    renderModal();
};

function renderModal() {
    const body = document.getElementById('modalBody');
    body.innerHTML = analysisResult.candidates.map((c, i) => `
        <div class="cand" onclick="selectCand(${i}, this)">
            <div style="font-size:24px; font-weight:700; color:white;">${c.mot.toUpperCase()}</div>
        </div>
    `).join('');
}

window.selectCand = (idx, el) => {
    document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
    selectedCand = analysisResult.candidates[idx].mot;
    document.getElementById('chooseBtn').disabled = false;
};

document.getElementById('chooseBtn').onclick = () => {
    editor.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%"><span class="replaced-word">${selectedCand}</span></div>`;
    modalWrap.classList.remove('open');
    analysisResult = null;
    secretDots.classList.remove('active');
};
</script>
</body>
</html>
