<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg: #000; --s1: #1C1C1E; --s2: #2C2C2E; --s3: #3A3A3C; --txt: #FFFFFF; --txt2: #8E8E93; --yellow: #FFD60A; --sep: rgba(255,255,255,0.1); }
html, body { height: 100%; background: #0a0a0a; display: flex; align-items: center; justify-content: center; font-family: -apple-system, "SF Pro Text", sans-serif; overflow: hidden; }

.phone { width: 393px; height: 852px; background: var(--bg); border-radius: 54px; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 0 0.5px #3a3a3a, 0 50px 100px rgba(0,0,0,0.9); }
@media (max-height: 870px) { .phone { height: calc(100vh - 20px); width: min(393px, calc((100vh - 20px) * 0.462)); } }
@media (max-width: 420px) { .phone { width: 100vw; height: 100dvh; border-radius: 0; } }

.island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 122px; height: 36px; background: #000; border-radius: 22px; border: 1px solid #1c1c1c; z-index: 40; }
.sbar { height: 58px; padding: 18px 26px 0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.sbar-time { font-size: 15px; font-weight: 600; color: var(--txt); }

.navbar { height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
.nav-back { width: 34px; height: 34px; border-radius: 50%; background: var(--s2); border: none; display: flex; align-items: center; justify-content: center; }
.nav-center { display: flex; align-items: center; gap: 10px; }
.nav-pill { display: flex; align-items: center; background: var(--s2); border-radius: 22px; padding: 6px 14px; gap: 14px; }
.nav-pill-btn { background: none; border: none; cursor: pointer; color: var(--txt); }
.dots { display: flex; align-items: center; gap: 3.5px; }
.dot { width: 4px; height: 4px; background: var(--txt); border-radius: 50%; transition: opacity .5s; }
.dot.off { opacity: 0; }
.nav-done { width: 34px; height: 34px; border-radius: 50%; background: var(--yellow); border: none; display: flex; align-items: center; justify-content: center; }

.note-body { flex: 1; overflow-y: auto; padding: 8px 20px 20px; }
.note-editor { width: 100%; min-height: 100%; font-size: 17px; line-height: 1.65; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--yellow); white-space: pre-wrap; }
.replaced-word { font-size: 32px; font-weight: 700; color: var(--yellow); letter-spacing: -1px; }

.toolbar { height: 48px; background: #1a1a1a; border-top: 0.5px solid var(--sep); display: flex; align-items: center; padding: 0 4px; }
.tb-btn { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; background: none; border: none; color: rgba(255,255,255,0.75); }

.setup-screen { position: absolute; inset: 0; background: #000; z-index: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; }
.setup-input { width: 100%; padding: 15px; background: var(--s1); border: 1.5px solid var(--s3); border-radius: 14px; color: #fff; font-family: monospace; margin-bottom: 12px; outline: none; }
.setup-btn { width: 100%; padding: 16px; background: var(--yellow); border: none; border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; }

.modal-wrap { position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(16px); z-index: 300; display: none; align-items: flex-end; }
.modal-wrap.open { display: flex; }
.modal-sheet { width: 100%; background: #1c1c1e; border-radius: 22px 22px 0 0; padding: 20px; color: white; max-height: 80%; overflow-y: auto; }
.cand { background: var(--s2); border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; border: 1.5px solid transparent; }
.cand.sel { border-color: var(--yellow); background: rgba(255,214,10,0.05); }
</style>
</head>
<body>

<div class="phone">
    <div class="island"></div>
    <div class="sbar"><span class="sbar-time" id="sbarTime">09:41</span></div>

    <div class="navbar">
        <button class="nav-back"><svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="white" stroke-width="2"><path d="M8.5 1L2 6.5 8.5 12"/></svg></button>
        <div class="nav-center">
            <div class="nav-pill">
                <button class="nav-pill-btn"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="1.7"><path d="M10 13V3M6 7l4-4 4 4"/><path d="M4 11v6h12v-6"/></svg></button>
                <div style="width:1px; height:15px; background:rgba(255,255,255,0.15)"></div>
                <button class="nav-pill-btn" id="dotsBtn">
                    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot off" id="dot3"></div></div>
                </button>
            </div>
            <button class="nav-done" id="btnDone"><svg width="17" height="17" viewBox="0 0 17 17" fill="none" stroke="black" stroke-width="2.6"><path d="M2.5 8.5l4.5 4.5 8-8"/></svg></button>
        </div>
    </div>

    <div class="note-body"><div class="note-editor" id="noteEditor" contenteditable="true" spellcheck="false"></div></div>

    <div class="toolbar">
        <button class="tb-btn">Aa</button>
        <button class="tb-btn">🔘</button>
        <button class="tb-btn">田</button>
        <button class="tb-btn">📎</button>
        <button class="tb-btn" id="btnKb">⌨</button>
    </div>

    <div class="setup-screen" id="setupScreen">
        <h2 style="color:white; margin-bottom:12px;">Configuration</h2>
        <input class="setup-input" id="apiKeyInput" type="password" placeholder="Token Hugging Face (hf_...)">
        <button class="setup-btn" id="setupBtn">Commencer le tour</button>
    </div>

    <div class="modal-wrap" id="modalWrap">
        <div class="modal-sheet">
            <h3 style="margin-bottom:15px;">Mots détectés 🎩</h3>
            <div id="modalBody"></div>
            <button class="setup-btn" id="chooseBtn" style="margin-top:15px;" disabled>Révéler ce mot</button>
        </div>
    </div>
</div>

<script>
const WEBHOOK_URL = "https://11q.co/api/last/43"; 
const INACTIVITY_MS = 2500; 

let hfToken = localStorage.getItem('hf_token_magic') || '';
let analysisResult = null;
let analysisRunning = false;
let selectedCand = null;
let timer;

const editor = document.getElementById('noteEditor');
const dot3 = document.getElementById('dot3');
const modalWrap = document.getElementById('modalWrap');

if (hfToken) document.getElementById('setupScreen').style.display = 'none';

document.getElementById('setupBtn').onclick = () => {
    const val = document.getElementById('apiKeyInput').value;
    if (val.startsWith('hf_')) {
        hfToken = val;
        localStorage.setItem('hf_token_magic', val);
        document.getElementById('setupScreen').style.display = 'none';
    }
};

async function sendToWebhook(word) {
    if (!WEBHOOK_URL) return;
    try {
        await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lastWord: word })
        });
    } catch(e) {}
}

function extractLetterSets(lines) {
    return lines.map(w => {
        const clean = w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
        return [...new Set((clean.match(/[A-Z]/g) || []))];
    });
}

async function runAnalysis() {
    const lines = editor.innerText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (lines.length < 2 || analysisRunning) return;

    analysisRunning = true;
    const sets = extractLetterSets(lines);
    sendToWebhook(lines[lines.length - 1]);

    const prompt = `Tu es un magicien. Trouve un mot français de EXACTEMENT ${lines.length} lettres.
    Contraintes (chaque lettre du mot secret doit être dans le mot correspondant écrit par le spectateur) :
    ${sets.map((s,i)=>`Lettre ${i+1} parmi: [${s.join(',')}]`).join('; ')}
    Réponds UNIQUEMENT en JSON: {"candidates": [{"mot": "MOT", "confiance": "haute"}]}`;

    try {
        const resp = await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${hfToken}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ inputs: prompt })
        });
        const data = await resp.json();
        const text = data[0].generated_text.split('[/INST]')[1] || data[0].generated_text;
        const jsonMatch = text.match(/\{.*\}/s);
        if (jsonMatch) {
            analysisResult = JSON.parse(jsonMatch[0]);
            dot3.classList.remove('off'); // SIGNAL SECRET : Le 3ème point s'affiche
        }
    } catch(e) { console.error(e); }
    analysisRunning = false;
}

editor.oninput = () => {
    dot3.classList.add('off'); // Cache le point dès que l'utilisateur écrit
    clearTimeout(timer);
    timer = setTimeout(runAnalysis, INACTIVITY_MS);
};

document.getElementById('dotsBtn').onclick = () => {
    if (!analysisResult) return;
    modalWrap.classList.add('open');
    renderModal();
};

function renderModal() {
    const body = document.getElementById('modalBody');
    body.innerHTML = analysisResult.candidates.map((c, i) => `
        <div class="cand" onclick="selectCand(${i}, this)">
            <div style="font-size:22px; font-weight:700;">${c.mot.toUpperCase()}</div>
            <div style="font-size:11px; color:gray; margin-top:4px;">Confiance: ${c.confiance}</div>
        </div>
    `).join('');
}

window.selectCand = (idx, el) => {
    document.querySelectorAll('.cand').forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
    selectedCand = analysisResult.candidates[idx].mot;
    document.getElementById('chooseBtn').disabled = false;
};

document.getElementById('chooseBtn').onclick = () => {
    // REMPLACEMENT : Le mot secret prend toute la place
    editor.innerHTML = `<span class="replaced-word">${selectedCand.toUpperCase()}</span>`;
    modalWrap.classList.remove('open');
    analysisResult = null;
    dot3.classList.add('off');
};

document.getElementById('btnDone').onclick = () => editor.blur();
document.getElementById('btnKb').onclick = () => editor.blur();
modalWrap.onclick = (e) => { if(e.target === modalWrap) modalWrap.classList.remove('open'); };

setInterval(() => {
    const n = new Date();
    document.getElementById('sbarTime').innerText = n.getHours().toString().padStart(2,'0') + ':' + n.getMinutes().toString().padStart(2,'0');
}, 1000);
</script>
</body>
</html>
