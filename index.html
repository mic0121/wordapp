<title>Notes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg: #000; --s2: #1C1C1E; --txt: #FFFFFF; --txt-back: #FFD60A; }
body { background: #000; display: flex; justify-content: center; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; }
.phone { width: 393px; height: 100%; background: var(--bg); position: relative; display: flex; flex-direction: column; }
.navbar { height: 95px; padding: 45px 16px 0; display: flex; align-items: center; justify-content: space-between; z-index: 30; }
.nav-back-pill { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.nav-back-text { font-size: 17px; color: var(--txt-back); }
.nav-right-pill { display: flex; align-items: center; gap: 12px; background: var(--s2); border-radius: 20px; padding: 6px 14px; }
.dots { display: flex; align-items: center; gap: 3.5px; cursor: pointer; padding: 5px; opacity: 0.2; transition: 0.3s; }
.dots.active { opacity: 1; }
.dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--txt); }
.dots.active .dot { background: var(--txt-back); }
.note-body { flex: 1; overflow-y: auto; padding: 10px 20px 280px; }
.note-editor { width: 100%; min-height: 300px; font-size: 21px; line-height: 1.6; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--txt-back); white-space: pre-wrap; font-weight: 500; }
.ana-line { display: block; margin-bottom: 2px; font-size: 21px; }
.ana-key { font-weight: 700; text-transform: uppercase; color: var(--txt-back); }
.ana-val { color: #828286; font-weight: 400; }
.ana-final { display: block; margin-top: 15px; font-weight: 600; color: #fff; font-size: 24px; text-transform: capitalize; border-top: 1px solid #333; padding-top: 10px; }
.replaced-word { font-size: 28px; font-weight: 800; color: var(--txt-back); text-transform: uppercase; display: block; margin-bottom: 12px; border-left: 3px solid var(--txt-back); padding-left: 15px; line-height: 1.2; }
.toolbar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px 15px calc(70px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(25px); border-top: 0.3px solid rgba(255,255,255,0.15); }
.tb-pill { background: #1C1C1E; border-radius: 30px; padding: 10px 18px; display: flex; gap: 22px; border: 0.5px solid #333; align-items: center; }
.tb-icon { width: 22px; height: 22px; stroke: #FFF; fill: none; stroke-width: 1.6; cursor: pointer; }
.new-note-circle { background: #1C1C1E; border: 0.5px solid #333; border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; }
</style>

let vaultDictionary = { word: "", lines: 0 };
let vaultAnagram = { html: "", lines: 0 };
let ghostCandidates = []; 
let ghostList = [];      

const editor = document.getElementById('editor');
const dotsBtn = document.getElementById('dotsBtn');
const anaBtn = document.getElementById('anaBtn');
const backBtn = document.getElementById('backBtn');
const newNoteBtn = document.getElementById('newNoteBtn');

// Nettoyage strict des inputs (majuscules, pas d'accents, pas d'espaces)[cite: 1]
function normalize(str) { 
    return str.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z]/g, ''); 
}

editor.oninput = () => {
    const rawLines = editor.innerText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const lineCount = rawLines.length;

    if (lineCount >= 1) {
        ghostList = [...rawLines];
        autoCalculateAnagram(ghostList);
    }

    if (lineCount >= 2) {
        const sets = rawLines.map(l => new Set(normalize(l).split('')));
        const currentCandidates = DICTIONARY.filter(word => {
            const norm = normalize(word);
            if (norm.length !== lineCount) return false;
            for (let i = 0; i < norm.length; i++) { 
                if (!sets[i].has(norm[i])) return false; 
            }
            return true;
        });

        // Affichage de jusqu'à 3 mots secrets possibles[cite: 1]
        if (currentCandidates.length > 0) { 
            ghostCandidates = currentCandidates.slice(0, 3); 
            dotsBtn.classList.add('active');
            if (lineCount >= vaultDictionary.lines) {
                vaultDictionary.word = ghostCandidates.join(' / ');
                vaultDictionary.lines = lineCount;
            }
        } else {
            dotsBtn.classList.remove('active');
        }
    }
};

function autoCalculateAnagram(words) {
    let currentWords = [...words];
    const initialLineCount = currentWords.length;
    let usedLetters = new Set();
    let displayHTML = "";

    // Boucle de filtrage par lettres
    for (let i = 0; i < 15; i++) {
        let char = getBestLetter(currentWords, usedLetters);
        if (!char) break;
        usedLetters.add(char);
        let noWords = currentWords.filter(w => !normalize(w).includes(char));
        if (noWords.length > 0) {
            displayHTML += `<div class="ana-line"><span class="ana-key">${char} - </span><span class="ana-val">${noWords.map(w => w.toLowerCase()).join(', ')}</span></div>`;
            currentWords = currentWords.filter(w => normalize(w).includes(char));
        }
        if (currentWords.length <= 1) break;
    }
    
    // Solution ultime pour le dernier mot : On l'affiche toujours s'il reste un mot[cite: 1]
    if (currentWords.length > 0) {
        displayHTML += `<div class="ana-final">${currentWords[0]}</div>`;
    }
    
    if (initialLineCount >= vaultAnagram.lines) {
        vaultAnagram.html = displayHTML;
        vaultAnagram.lines = initialLineCount;
    }
}

function getBestLetter(wordList, usedLetters) {
    let counts = {};
    wordList.forEach(w => {
        let normW = normalize(w);
        let uniqueChars = new Set(normW.split(''));
        uniqueChars.forEach(c => { if (!usedLetters.has(c)) counts[c] = (counts[c] || 0) + 1; });
    });
    let bestChar = null; let minDiff = Infinity;
    for (let char in counts) {
        let noCount = wordList.filter(w => !normalize(w).includes(char)).length;
        if (noCount > 0 && noCount <= 2 && noCount < minDiff) { minDiff = noCount; bestChar = char; }
    }
    return bestChar || Object.keys(counts)[0];
}

anaBtn.onclick = (e) => { 
    e.preventDefault(); 
    if (editor.innerText.trim() === "" && vaultAnagram.html !== "") {
        editor.innerHTML = vaultAnagram.html;
        editor.contentEditable = "false";
    }
};

dotsBtn.onclick = () => {
    if (editor.innerText.trim() === "" && vaultDictionary.word !== "") {
        editor.innerHTML = `<span class="replaced-word">${vaultDictionary.word}</span>`;
        editor.contentEditable = "false";
    }
};

backBtn.onclick = () => { 
    editor.contentEditable = "true"; 
    editor.innerHTML = ""; 
};

newNoteBtn.onclick = () => {
    editor.innerHTML = "";
    editor.contentEditable = "true";
    ghostCandidates = [];
    ghostList = [];
    vaultDictionary = { word: "", lines: 0 };
    vaultAnagram = { html: "", lines: 0 };
    dotsBtn.classList.remove('active');
    editor.focus();
};
