<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Notes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg: #000; --s2: #1C1C1E; --txt: #FFFFFF; --txt-back: #FFD60A; }

html, body { height: 100%; background: #000; display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; overflow: hidden; }

.phone { width: 393px; height: 852px; background: var(--bg); border-radius: 54px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
@media (max-height: 870px) { .phone { height: 100vh; width: calc(100vh * 0.46); } }
@media (max-width: 420px) { .phone { width: 100vw; height: 100dvh; border-radius: 0; } }

/* Navbar */
.navbar { height: 95px; padding: 45px 12px 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 30; }
.nav-back-pill { display: flex; align-items: center; gap: 6px; background: var(--s2); border-radius: 20px; padding: 6px 12px; cursor: pointer; }
.nav-back-text { font-size: 17px; color: var(--txt-back); }

.nav-right-pill { display: flex; align-items: center; gap: 12px; background: var(--s2); border-radius: 20px; padding: 6px 14px; }
.dots { display: flex; align-items: center; gap: 3.5px; cursor: pointer; padding: 5px; }
.dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--txt); opacity: 0.2; transition: 0.3s; }
.dots.active .dot { background: var(--txt-back); opacity: 1; box-shadow: 0 0 8px var(--txt-back); }

/* Editor */
.note-body { flex: 1; overflow-y: auto; padding: 10px 20px 140px; }
.note-editor { width: 100%; min-height: 100%; font-size: 21px; line-height: 1.6; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--txt-back); white-space: pre-wrap; font-weight: 500; }

/* Anagramme Style Image */
.ana-line { display: block; margin-bottom: 8px; font-size: 22px; }
.ana-key { font-weight: 700; color: #fff; }
.ana-val { color: #aaa; font-weight: 400; }
.ana-final { display: block; margin-top: 20px; font-weight: 700; color: #fff; font-size: 24px; }

.replaced-word { font-size: 32px; font-weight: 800; color: var(--txt-back); text-transform: uppercase; display: block; margin-bottom: 12px; border-left: 3px solid var(--txt-back); padding-left: 15px; }

/* Toolbar */
.toolbar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 0 15px calc(8px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; }
.tb-pill { background: #1C1C1E; border-radius: 30px; padding: 12px 20px; display: flex; gap: 24px; border: 0.5px solid #333; align-items: center; }
.tb-icon { width: 22px; height: 22px; stroke: #FFF; fill: none; stroke-width: 1.8; cursor: pointer; }
</style>
</head>
<body>

<div class="phone">
    <div class="navbar">
        <div class="nav-back-pill" id="backBtn">
            <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M9 1L1 8L9 15" stroke="#FFD60A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-back-text">Notes</span>
        </div>
        <div class="nav-right-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 15V3m-4 4l4-4 4 4M4 12v8h16v-8"/></svg>
            <div style="width: 1px; height: 15px; background: rgba(255,255,255,0.1);"></div>
            <div id="dotsBtn" class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>
    </div>

    <div class="note-body">
        <div class="note-editor" id="editor" contenteditable="true" spellcheck="false" placeholder="Liste de mots..."></div>
    </div>

    <div class="toolbar">
        <div class="tb-pill">
            <svg class="tb-icon" id="anaBtn" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><rect x="2" y="4" width="14" height="14" rx="2"/></svg>
            <svg class="tb-icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            <svg class="tb-icon" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
            <svg class="tb-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
        </div>
        <div style="background: #1C1C1E; border: 0.5px solid #333; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
    </div>
</div>

<script>
const DICTIONARY = ["SANDALE","BOULE","SAPIN","BOULES","MAISON","SOLEIL","NUAGE","ARGENT","AMOUR","BAGUE","VAGUE","SIRENE","FLEUR","CHIEN","CHAT","ETOILE","LIVRE","BATEAU","MONDE","PAPIER","ECOLE","TRAVAIL","FORME","VISAGE","PIED","MAIN","OISEAU","POISSON","TERRE","PIERRE","SABLE","VENT","FEU","PLUIE","NEIGE","ESPRIT","REVE","FORCE","TEMPS","HEURE","CHAISE","TABLE","PORTE","FENETRE","CHAMBRE","CUISINE","POMME","PAIN","EAU","VERRE","CAFE","MUSIQUE","DANSE","FILM","IMAGE","PHOTO","MONTRE","BIJOU","CLEF","LAMPE","ROUGE","BLEU","VERT","JAUNE","BLANC","NOIR","GRIS","ROSE","VIOLET","ORANGE","PETIT","GRAND","LARGE","LOURD","LEGER","CALME","BRUIT","CHAUD","FROID","FAMILLE","VOYAGE","VALISE","AVION","TRAIN","AUTO","ROUTE","VILLAGE","VILLE","PAYS","MER","LAC","FORET","JARDIN","VACHE","CHEVAL","LOUP","OURS","SINGE","LAPIN","JOIE","PEUR","COLERE","RIRE","VIVRE","MORT","VIE","SANG","PEAU","YEUX","NEZ","DENT","MODE","SAC","VESTE","ROBE","JUPE","BOTTE","HABIT","TAPIS","LIT","PAIX","GUERRE","SOLDAT","ARME","JEU","BALLE","SPORT","FOOT","VITESSE","MANGER","BOIRE","DORMIR","VOIR","LIRE","ECRIRE","SAVOIR","ALLER","PARTIR","RESTER","OUVRIR","FERMER","COUPER","CASSER","AIDER","AIMER","DIRE","FAIRE","SORTIR","ENTRER","PROPRE","SALE","PLEIN","VIDE","RAPIDE","LENT","UTILE","FACILE","DUR","SIMPLE","HAUT","BAS","DROIT","GAUCHE","DANS","SOUS","PRES","LOIN","AVANT","APRES","DEMAIN","HIER","MATIN","SOIR","MIDI","LUNE","CIEL","ESPACE","ASTRE","FLAMME","ORAGE","ECLAIR","METAL","ACIER","PIECE","BILLET","BANQUE","ACHAT","VENTE","PRIX","CADEAU","FETE","NOEL","HISTOIRE","CHANCE","ECHEC","SUCCES","VICTOIRE","DRAPEAU","NORD","SUD","EST","OUEST","GLACE","DESERT","PISCINE","PONT","MUSEE","HOTEL","THEATRE","CIRQUE","CLOWN","MAGIE","SECRET","ENIGME","OMBRE","LUMIERE","SONGE","SOUVENIR","MALADE","MEDECIN","HOPITAL","TABAC","POISON","CHASSE","PECHE","PLANTE","RACINE","TRONC","FEUILLE","GRAINE","SAISON","ETE","HIVER","COUSIN","EPOUX","VOISIN","CLIENT","COUPLE","ANGE","DIABLE","MONSTRE","GEANT","NAIN","SORCIER","DRAGON","ROBOT","PILOTE","MARIN","POETE","ARTISTE","ACTEUR","DESSIN","LIGNE","POINT","CERCLE","CARRE","CHIFFRE","NOMBRE","SOMME","TOTAL","MOITIE","DOUBLE","UNIQUE","SAGE","FOU","BEAU","LAID","VIEUX","JEUNE","NEUF","ANCIEN","DOUX","AMER","SALEE","SUCREE","ACIDE","FRAIS","SEC","HUMIDE","MOU","SOMBRE","CLAIR","VIF","PALE","FIN","TENDRE","TRISTE","HEUREUX","SEVERE","GENTIL","MÉCHANT","RARE","COMMUN","PUBLIC","PRIVE","SOCIAL","SACRE","MODERNE","ACTUEL","PROCHE","FINAL","SANS","AVEC","POUR","VERS","CHEZ","HORS","TAXE","COUT","GAIN","ACTION","BOURSE","ORDRE","COURS","RISQUE","VALEUR","OFFRE","DEMANDE","METIER","EMPLOI","SALAIRE","PATRON","EQUIPE","PROJET","BUT","CIBLE","PLAN","ETAPE","METHODE","OUTIL","MOYEN","OBJET","CHOSE","TRUC","MACHIN","GADGET","SENS","LOGIQUE","IDEE","NOTION","MOT","NOM","TITRE","PAGE","CARTE","INDEX","LISTE","BLOC","ZONE","TAILLE","VOLUME","MASSE","POIDS","FORCE","ENERGIE","DEGRES","SIGNAL","RADIO","ECRAN","CODE","WEB","DATA","PUCE","DISK","CABLE","PRISE","VOLT","WATT","MOTEUR","ROUE","FREIN","COQUE","AILE","VOILE","ANCRE","QUAI","PORT","PHARE","ROUTE","RUE","VOIE","PISTE","CANAL","PAS","SAUT","FLUX","VAGUE","MAREE","COURANT","BORD","RIVE","PLAGE","COTE","ILE","RECIF","ABIME","FOND","DOS","COEUR","POUMON","OS","NERF","ATOME","GRAIN","ICI","LA","TARD","TOT","VRAI","FAUX","NON","OUI","BREF"];

let originalText = "";
let foundCandidates = [];
let timer;
const editor = document.getElementById('editor');
const dotsBtn = document.getElementById('dotsBtn');
const anaBtn = document.getElementById('anaBtn');
const backBtn = document.getElementById('backBtn');

function analyze() {
    const rawLines = editor.innerText.trim().split('\n').filter(l => l.trim().length > 0);
    if (rawLines.length < 2) return;
    const sets = rawLines.map(l => new Set(l.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split('')));
    
    foundCandidates = DICTIONARY.filter(word => {
        const norm = word.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
        if (norm.length !== rawLines.length) return false;
        for (let i = 0; i < norm.length; i++) if (!sets[i].has(norm[i])) return false;
        return true;
    });
    if (foundCandidates.length > 0) dotsBtn.classList.add('active');
}

function runAnagram() {
    const raw = editor.innerText.trim();
    if (!raw) return;
    originalText = raw;
    const words = [...new Set(raw.split(/[\n,]+/).map(w => w.trim().toUpperCase()).filter(w => w.length > 1))];
    if (words.length < 2) return;

    let html = '';
    let remaining = [...words];
    let safety = 0;

    while (remaining.length > 1 && safety < 12) {
        safety++;
        let counts = {};
        remaining.forEach(w => { [...new Set(w.split(''))].forEach(l => counts[l] = (counts[l] || 0) + 1); });
        
        let bestLetter = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
        let yes = remaining.filter(w => w.includes(bestLetter));
        let no = remaining.filter(w => !w.includes(bestLetter));

        if (no.length > 0) {
            let info = no.join(', ').toLowerCase();
            html += `<div class="ana-line"><span class="ana-key">${bestLetter} - </span><span class="ana-val">${info || '...'}</span></div>`;
            remaining = yes;
        } else {
            delete counts[bestLetter];
            if (Object.keys(counts).length === 0) break;
        }
    }

    if (remaining.length === 1) {
        html += `<div class="ana-final">${remaining[0].charAt(0).toUpperCase() + remaining[0].slice(1).toLowerCase()}</div>`;
    }
    
    editor.innerHTML = html;
    editor.contentEditable = "false";
}

editor.oninput = () => {
    dotsBtn.classList.remove('active');
    clearTimeout(timer);
    timer = setTimeout(analyze, 2000);
};

dotsBtn.onclick = () => {
    if (foundCandidates.length === 0) return;
    originalText = editor.innerText;
    const displayWords = foundCandidates.slice(0, 3);
    editor.innerHTML = '<div class="reveals">' + displayWords.map(w => `<span class="replaced-word">${w}</span>`).join('') + '</div>';
    editor.contentEditable = "false";
    dotsBtn.classList.remove('active');
};

anaBtn.onclick = runAnagram;

backBtn.onclick = () => {
    if (originalText !== "") {
        editor.contentEditable = "true";
        editor.innerHTML = ""; 
        editor.innerText = originalText;
        originalText = "";
    }
};
</script>
</body>
</html>
