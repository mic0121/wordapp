        // --- MOTEUR DE CALCUL ---
        function getGhostMatches(lines) {
            if (lines.length < 4) return [];
            return dictionnaire.filter(word => {
                if (word.length !== lines.length) return false;
                return lines.every((line, i) => line.toUpperCase().includes(word[i]));
            });
        }

        function getAnagram(word) {
            if(!word) return "";
            return word.split('').sort(() => Math.random() - 0.5).join('').toUpperCase();
        }

        // --- TRACKING EN TEMPS RÉEL ---
        editor.oninput = () => {
            const currentText = editor.innerText.trim();
            const lines = currentText.split('\n').filter(l => l.trim() !== "");
            
            // Si l'utilisateur tape des trucs, on sauve les lignes non vides
            if (lines.length > 0) {
                savedLines = [...lines];
                finalMatches = getGhostMatches(savedLines);
            }

            // Gestion de la couleur des points
            if (finalMatches.length > 0) {
                dotsBtn.classList.add('active');
            } else {
                dotsBtn.classList.remove('active');
            }
        };

        // --- ACTION : MOT SECRET (POINTS) ---
        dotsBtn.onclick = () => {
            if (finalMatches.length > 0) {
                const display = finalMatches.slice(0, 3).join(' | ');
                editor.innerHTML = `<div style="font-weight:bold; color:var(--orange)">${display}</div>`;
                editor.contentEditable = "false";
                dotsBtn.classList.remove('active');
            }
        };

        // --- ACTION : ANAGRAMME (LIVRE) ---
        anaBtn.onclick = () => {
            if (savedLines.length > 0) {
                const lastLine = savedLines[savedLines.length - 1];
                const anagramme = getAnagram(lastLine);
                editor.innerHTML = `<div style="font-weight:bold; letter-spacing: 2px;">${anagramme}</div>`;
                editor.contentEditable = "false";
            }
        };

        // --- RESET ---
        editor.onclick = () => {
            if (editor.contentEditable === "false") {
                editor.innerHTML = "";
                editor.contentEditable = "true";
                editor.focus();
            }
        };

        window.onload = () => editor.focus();
    </script>
