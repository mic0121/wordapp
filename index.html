<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Notes</title>
    <style>
        :root {
            --ios-yellow: #ffd60a;
            --ios-bg: #000000;
            --ios-secondary: #1c1c1e;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px 20px 10px 20px;
        }

        .back-btn {
            background: var(--ios-secondary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-right-group {
            background: var(--ios-secondary);
            border-radius: 25px;
            padding: 6px 16px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .icon-header { fill: white; width: 22px; height: 22px; transition: fill 0.3s; cursor: pointer; }
        .icon-header.active { fill: var(--ios-yellow); }

        #editor {
            flex: 1;
            padding: 20px;
            font-size: 19px;
            line-height: 1.5;
            outline: none;
            caret-color: var(--ios-yellow);
            white-space: pre-wrap;
        }

        .toolbar-container {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .main-tools, .edit-btn { pointer-events: auto; }

        .main-tools {
            background: var(--ios-secondary);
            border-radius: 35px;
            padding: 12px 22px;
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .edit-btn {
            background: var(--ios-secondary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-icon { fill: white; width: 24px; height: 24px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="back-btn" id="btn-back">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="white"/></svg>
        </div>
        <div class="header-right-group">
            <svg class="icon-header" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            <svg id="status-dots" class="icon-header" viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
    </div>

    <div id="editor" contenteditable="true" spellcheck="false"></div>

            <svg class="tool-icon" viewBox="0 0 24 24"><path d="M11 4.07V2.05c-2.01.2-3.84 1-5.32 2.21L7.1 5.69c1.11-.86 2.44-1.44 3.9-1.62zM7.1 18.31l-1.42 1.42c1.48 1.21 3.31 2.01 5.32 2.21v-2.02c-1.46-.18-2.79-.76-3.9-1.61zM18.31 7.1l1.42-1.42c-1.21-1.48-3.31-2.01-5.32-2.21v2.02c1.46.18 2.79.76 3.9 1.61zM11 21.95v-2.02c-1.46-.18-2.79-.76-3.9-1.61L5.68 19.74c1.48 1.21 3.31 2.01 5.32 2.21z"/></svg>
        </div>
        <div class="edit-btn">
            <svg class="tool-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
        </div>
    </div>

        const btnAna = document.getElementById('trigger-ana');
        const btnBack = document.getElementById('btn-back');

        let possibleWords = [];

        let originalContent = "";
        let anaStep = 0;

        // Dictionnaire 1000+ mots (4-8 lettres)
        const rawData = "SOLEIL,POESIE,ARGENT,AVENIR,BATEAU,CACHET,DESSIN,ESPOIR,FLEUVE,GLOIRE,HASARD,INSTANT,JOURNAL,LIBERTÉ,MIROIR,NUAGES,OISEAU,PALAIS,QUARTZ,ROCHER,SOUFFLE,TRAIN,VALLEE,ZÉPHYR,ABANDON,ACTEURS,ADRESSE,AFFICHE,AIGUILLE,ALIMENT,ALLIANCE,AMPOULE,ANALYSE,ANGLAIS,ANIMAUX,ANNONCE,APARTÉ,APPEL,APPRÊT,ARDOISE,ARRIVÉE,ARTICLE,ASPECT,ASSIETTE,AUDIENCE,AUTEURS,AVOCATS,BALANCE,BALEINE,BALLONS,BANANIER,BAPTÊME,BARRIÈRE,BASIQUE,BATAILLE,BATEAUX,BATTERIE,BERCEAU,BESOINS,BEURRE,BICYCLE,BILAN,BILLETS,BIOLOGIE,BIVOUAC,BLANCHE,BLOCAGE,BOBINES,BOISSON,BOMBARDE,BONHEUR,BORDURE,BOUCLE,BOUGIE,BOULOT,BOURSES,BOUTEILLE,BOUTON,BRANCHES,BRASIER,BRETELLE,BRIQUE,BROCHURE,BROUILLE,BUDGET,BUFFALO,BUISSON,BUREAUX,CABARET,CABINES,CADAVRE,CADEAU,CADRAGE,CAILLOU,CAISSON,CALCULS,CALÈCHE,CALIBRE,CAMÉRA,CAMPING,CANARDS,CANDIDE,CANNELLE,CAPABLE,CAPSULE,CAPTEUR,CARAMEL,CARGOS,CARNETS,CASCADE,CASQUE,CAVALIER,CELLULE,CENSURE,CERCLES,CERISE,CERVEAU,CHALEUR,CHAMBRE,CHANCE,CHANSON,CHARBON,CHÂSSIS,CHÂTEAU,CHEMISE,CHÈQUES,CHEVEUX,CHIFFRE,CHIMÈRE,CHORALE,CHROME,CIMENT,CINÉMA,CINTRES,CISEAUX,CITOYEN,CLARINET,CLAVIER,CLICHÉS,CLOCHE,CLÔTURE,COFFRET,COIFFEUR,COLÈRE,COLIBRI,COLLECTE,COLLÈGE,COLONNE,COMBATS,COMBINA,COMÉDIE,COMMANDO,COMMERCE,COMPLET,COMPRIS,CONCERT,CONCOURS,CONDUIT,CONFIAN,CONFORT,CONGRES,CONSEIL,CONTACT,CONTENU,CONTOUR,CONTRAT,COPEAUX,COQUILLE,CORDEUR,CORNET,COULOIR,COURAGE,COUREUR,COURSES,COUTEAU,COUTURE,COUVREUR,CRÂNIEN,CRAYONS,CRÉANCE,CRÉDITS,CREVAIS,CRISTAL,CRITÈRE,CROCHET,CROQUIS,CUISINE,CULTURE,CURIEUX,CYCLONE,CYLINDRE,DANGER,DANSEUR,DÉBATS,DÉCADRE,DÉCORS,DÉFAUTS,DÉFENSE,DÉFIS,DEGRÉS,DÉLICES,DEMANDE,DÉMENTI,DÉPART,DÉPENSE,DESSERT,DESTIN,DÉTAILS,DEVANT,DEVENIR,DIAMANT,DICTÉE,DIFFICIL,DIGNITÉ,DILENGE,DIMANCHE,DIPLÔME,DIRECTS,DISCOURS,DISCRET,DISQUES,DISTANCE,DIZAINE,DOCTEUR,DOMAINE,DOMMAGE,DONNÉES,DORURE,DOSSIER,DOUANE,DOUCEUR,DOUZAINE,DRAPEAU,DRESSAGE,DROIT,DURÉE,ÉCART,ÉCHANGE,ÉCHELLE,ÉCLAIR,ÉCOLES,ÉCOUTE,ÉCRAN,ÉCRITURE,ÉDITEUR,EFFACER,EFFETS,EFFORTS,ÉGALITÉ,ÉGOÏSME,ÉLÉGANT,ÉLÉM TAL,MENTEUR,MERCURE,MÉTHODE,MÉTIERS,MEUBLES,MICRO,MILIEU,MILLIER,MINCEUR,MINERAL,MIRACLE,MIROIR,MISSILE,MISSION,MOBILES,MODÈLES,MODERNE,MODIFIE,MODULES,MOELLON,MOISSON,MOMENTS,MONARQUE,MONNAIE,MONTANT,MONTRE,MORCEAU,MOTEURS,MOUETTE,MOULINS,MOUSSES,MOUTON,MUET,MUSIQUE,MYSTÈRE,NAGEUR,NAPPE,NATURE,NAVIRE,NÉANT,NEIGE,NEUTRE,NIVEAU,NOBLES,NOMBRE,NOTICE,NOTION,NOUVEAU,NUAGES,NUANCE,NUMÉRO,OBJECTIF,OBJETS,OBSTACL,OCCASIO,OCÉANS,OCTAVE,ODEURS,OFFRE,OISEAUX,OMBRE,ONDES,OPÉRA,ORAGE,ORANGE,ORBITES,ORCHIDÉ,ORDRE,ORGANE,ORGUEIL,ORIENT,ORIGINE,OUBLI,OURAGAN,OUTILS,OUVRAGE,OUVRIER,OXYGÈNE,PACHYDE,PAILLET,PAIX,PALAIS,PALETTE,PANIERS,PAPIERS,PAQUETS,PARADE,PARADIS,PAREILS,PARENTS,PARFAIT,PARFUMS,PARKING,PAROLES,PARTAGE,PARTIE,PASSAGE,PASSION,PASTEUR,PATIENT,PATRONS,PAUSE,PAYSAGE,PÊCHEUR,PEINTRE,PELOTON,PENDULE,PENSÉE,PENSEUR,PERDANT,PERDRIX,PERDRE,PERMIS,PERSON,PHASE,PHOQUES,PHOTOS,PHRASE,PIANOS,PIÈCE,PIERRE,PIGEONS,PILIER,PILOTES,PINCEAU,PIRATES,PISCINE,PISTAGE,PISTONS,PIVOTS,PLACARD,PLAFOND,PLAGES,PLAINTES,PLANÈTE,PLANTES,PLAQUES,PLATEAU,PLATRE,PLUIE,PLUME,PLURAL,POCHES,POÈMES,POÉSIE,POIDS,POINGS,POINTES,POISSON,POLICE,POMMES,POMPES,PORTES,POSTES,POUCE,POUDRE,POUPÉE,POUTRE,PRATIQUE,PRÉCIS,PRÉNOM,PRÉSENT,PREUVE,PRIÈRE,PRINCE,PRISME,PRISON,PROBLÈM,PROCÈS,PRODUIT,PROFIL,PROJET,PROMESSE,PROPOS,PROPRES,PRUDENT,PULSAR,PUPILLE,PYRAMID,QUALITÉ,QUARTZ,QUATRE,QUELQUE,QUÉRANT,QUESTIONS,QUEUE,QUIÉTUD,QUITTES,RACINES,RADARS,RADIANS,RADEAUX,RADIEUX,RAGOUTS,RAISINS,RALENTI,RAMEUR,RANCUNE,RAPIDE,RAPPEL,RAPPORT,RARETE,RASOIR,RAYONS,RÉACTION,RÉALITÉ,RÉCENT,RECETTE,RÉCIT,RECOURS,RECRUT,RECTEUR,RÉFÉRE,REFRAIN,REGARD,REGRET,REINES,RELIURE,REMEDE,REMISE,REMPLI,RENDRE,RENNES,RÉPONSE,REPOS,RÉSEAU,RESSORT,RESTE,RETOUR,RÉUSSIR,RÊVERIE,RIDEAUX,RIDEUR,RIMEUR,RISQUE,RIVAGE,RIVIÈRE,ROBINET,ROCHERS,ROQUETS,ROUAGE,ROUTES,ROUTIER,ROYAL,RUBANS,RUINES,RYTHMES,SABLIER,SACHETS,SAISON,SALADE,SALAIRE,SALONS,SANGLES,SAVEUR,SAVOIR,SCEAUX,SCÈNES,SCHÉMA,SCIENCE,SCORES,SCRUTIN,SÉANCE,SECOURS,SECRETS,SECTEUR,SÉJOUR,SELLE,SEMELLE,SEMAINE,SÉNAT,SENTIER,SERMENT,SERPENT,SERVICE,SESSION,SIFFLET,SIGNAUX,SILENCE,SILLON,SIMPLES,SINGE,SIRÈNE,SIROP,SIXIÈME,SOCIAL,SOCLE,SOIE,SOLEIL,SOLIDE,SOMMEIL,SOMMET,SONDAGE,SONNET,SORCIER,SORTIE,SOUFFLE,SOURCE,SOUVENI,SPATIAL,SQUARE,STADES,STAGES,STATIONS,STATUE,STATUT,STRESS,STUDIO,SUCCÈS,SUCRES,SUEUR,SUIVANT,SUJET,SUPPORT,SURFACE,SURSIT,SYNTAXE,SYSTÈME,TABLEAU,TACHES,TAILLE,TALENTS,TAMBOUR,TAMPONS,TANTÔT,TAPIS,TARDIF,TARIFS,TASSE,TAUX,TEINTES,TÉMOIN,TEMPETE,TEMPS,TENDRE,TENSION,TERRAIN,TERREUR,TERRIER,TEXTES,THÉÂTRE,THÉORIE,THERMOS,THÈMES,TIMBRES,TIRAGE,TIROIR,TISSUS,TITRE,TOILE,TOITURE,TOMATES,TOMBE,TONNEAU,TORCHE,TORRENT,TOUCHE,TOURNÉE,TOURS,TRACE,TRAFIC,TRAIN,TRAIT,TRANCHE,TRAVAIL,TRÉSOR,TRESSES,TRIANGL,TRIBUN,TRICOT,TRIPLE,TROPHÉE,TROUPE,TUMULTE,TUNNEL,TUTELLE,TUYAUX,TYPES,TYRAN,UNITÉ,UNIVERS,URGENCE,USAGES,USINES,UTILE,VACANCE,VAGUES,VALEUR,VALISE,VALLÉE,VAPEUR,VASE,VEILLE,VELOURS,VENDRE,VENGEUR,VENTRE,VERRE,VERROU,VERS,VESTE,VIANDE,VIBRER,VICTOIR,VIDÉO,VIEUX,VIGNE,VILLAGE,VILLE,VIRAGE,VISAGE,VISION,VISITE,VISUEL,VITRAIL,VITRE,VIVANT,VOILE,VOISIN,VOITURE,VOLANT,VOLET,VOLUME,VOYAGE,VOYANT,WAGON,WHISKY,XÉNON,XYLOPHO,YAOURT,ZÈBRE,ZÉPHYR,ZODIAQUE,ZONES";
        const dictionnaire = rawData.split(',').map(m => m.trim().toUpperCase());

        editor.oninput = () => {
            originalContent = editor.innerText;
            let lines = originalContent.split('\n').filter(l => l.trim() !== "");
            
            // Calculer jusqu'à 3 possibilités exactes
            possibleWords = dictionnaire.filter(word => {
                if (word.length !== lines.length) return false;
                return lines.every((line, i) => line.toUpperCase().includes(word[i]));
            }).slice(0, 3);

            if (possibleWords.length > 0) {
                dots.classList.add('active');
                currentWordIndex = 0;
            } else {
                dots.classList.remove('active');
                possibleWords = [];
            }
        };

        // ANAGRAMME PROGRESSIF (Logique de 12h00)
        btnAna.onclick = (e) => {
            e.preventDefault();
            let lines = editor.innerText.split('\n').filter(l => l.trim() !== "");
            if (lines.length === 0) return;

            let base = lines.map(l => l.trim()[0].toUpperCase()).join('');
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            
            let sequence = [
                base[0] || "?", 
                alphabet[Math.floor(Math.random() * 26)],
                base[Math.floor(base.length / 2)] || "X",
                alphabet[Math.floor(Math.random() * 26)],
                base[base.length - 1] || "!"
            ];

            if (anaStep < sequence.length) {
                showResult(sequence[anaStep], false);
                anaStep++;
            } else {
                anaStep = 0;
            }
        };

        // Points de suspension (Calcul dictionnaire)
        dots.onclick = (e) => {
            e.preventDefault();
            if (possibleWords.length > 0) {
                showResult(possibleWords[currentWordIndex], true);
                currentWordIndex = (currentWordIndex + 1) % possibleWords.length;
            }
        };

        // Bouton retour (Back)
        btnBack.onclick = () => {
            if (editor.contentEditable === "false") {
                editor.innerText = originalContent;
                editor.contentEditable = "true";
                anaStep = 0;
                editor.focus();
            }
        };

        function showResult(text, isSecret) {
            const color = isSecret ? 'var(--ios-yellow)' : 'white';
            editor.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100%; font-size:42px; color:${color}; font-weight:600; letter-spacing:8px; text-align:center;">${text}</div>`;
            editor.contentEditable = "false";
        }

        window.onload = () => editor.focus();
    </script>
</body>
