<head>
    <meta charset="UTF-8">

    <title>Notes</title>
    <style>
        :root {
            --ios-orange: #ff9f0a;
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-text: #ffffff;
            --ios-gray: #8e8e93;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--ios-bg);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--ios-text);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--ios-bg);
        }

        .back-btn {
            color: var(--ios-orange);
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .actions {
            display: flex;
            gap: 20px;
            color: var(--ios-orange);
        }

        .note-body {
            flex: 1;
            padding: 20px;
            font-size: 19px;
            line-height: 1.5;
            outline: none;
            overflow-y: auto;
            caret-color: var(--ios-orange);
        }

        .toolbar {
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 0.5px solid #38383a;
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(20px);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tool-icon {
            font-size: 24px;
            color: var(--ios-orange);
            cursor: pointer;
        }

        .tool-icon.inactive {
            opacity: 0.5;
        }
    </style>
</head>

","VOTER","VOTRE","VOULOIR","VOUS","VOYAGE","VRAI","WAGON","WATT","WHISKY","XYLO","YAOURT","YEUX","ZÈBRE","ZERO","ZONE"];

        function getGhostMatches(lines) {
            if (lines.length < 4 || lines.length > 8) return [];
            return dictionnaire.filter(word => {
                if (word.length !== lines.length) return false;
                return lines.every((line, i) => line.toUpperCase().includes(word[i]));
            });
        }

        function shuffleAnagram(text) {
            if (!text || text.length === 0) return "---";
            return text.split('').sort(() => Math.random() - 0.5).join('').toUpperCase();
        }

        editor.oninput = () => {
            const lines = editor.innerText.split('\n').filter(l => l.trim() !== "");
            if (lines.length > 0) {
                savedLines = [...lines];
                finalMatches = getGhostMatches(savedLines);
            }
        };

        dotsBtn.onclick = () => {
            if (finalMatches.length > 0) {
                editor.innerHTML = `<div style="color:var(--ios-orange); font-weight:bold; text-align:center; margin-top:50px; font-size:24px;">${finalMatches[0]}</div>`;
                editor.contentEditable = "false";
            }
        };

        anaBtn.onclick = () => {
            if (savedLines.length > 0) {
                const combinedText = savedLines.join('').replace(/\s/g, '');
                const result = shuffleAnagram(combinedText);
                editor.innerHTML = `<div style="text-align:center; margin-top:50px; letter-spacing:6px; font-size:22px; font-weight:bold;">${result}</div>`;
                editor.contentEditable = "false";
            }
        };

        editor.onclick = () => {
            if (editor.contentEditable === "false") {
                editor.innerHTML = "";
                editor.contentEditable = "true";
                editor.focus();
            }
        };

        window.onload = () => editor.focus();
    </script>
