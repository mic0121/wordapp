<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Notes</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg: #000; --s2: #1C1C1E; --txt: #FFFFFF; --txt-back: #FFD60A; }
body { background: #000; display: flex; justify-content: center; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; }

.phone { width: 393px; height: 100%; background: var(--bg); position: relative; display: flex; flex-direction: column; }

/* Navbar */
.navbar { height: 95px; padding: 45px 16px 0; display: flex; align-items: center; justify-content: space-between; z-index: 30; }
.nav-back-pill { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.nav-back-text { font-size: 17px; color: var(--txt-back); }
.nav-right-pill { display: flex; align-items: center; gap: 12px; background: var(--s2); border-radius: 20px; padding: 6px 14px; }
.dots { display: flex; align-items: center; gap: 3.5px; cursor: pointer; padding: 5px; opacity: 0.2; transition: 0.3s; }
.dots.active { opacity: 1; }
.dot { width: 4.5px; height: 4.5px; border-radius: 50%; background: var(--txt); }
.dots.active .dot { background: var(--txt-back); }

/* Body */
.note-body { flex: 1; overflow-y: auto; padding: 10px 20px 140px; }
.note-editor { width: 100%; min-height: 200px; font-size: 21px; line-height: 1.6; color: var(--txt); background: transparent; border: none; outline: none; caret-color: var(--txt-back); white-space: pre-wrap; font-weight: 500; }

/* Styles Anagramme */
.ana-line { display: block; margin-bottom: 2px; font-size: 21px; }
.ana-key { font-weight: 700; text-transform: uppercase; }
.ana-val { color: #828286; font-weight: 400; }
.ana-final { display: block; margin-top: 15px; font-weight: 600; color: #fff; font-size: 21px; text-transform: capitalize; }
.replaced-word { font-size: 32px; font-weight: 800; color: var(--txt-back); text-transform: uppercase; display: block; margin-bottom: 12px; border-left: 3px solid var(--txt-back); padding-left: 15px; }

/* Toolbar complète iOS */
.toolbar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px 15px calc(15px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
.tb-pill { background: #1C1C1E; border-radius: 30px; padding: 12px 20px; display: flex; gap: 24px; border: 0.5px solid #333; align-items: center; }
.tb-icon { width: 24px; height: 24px; stroke: #FFF; fill: none; stroke-width: 1.5; cursor: pointer; }
.tb-icon.active-magic { stroke: var(--txt-back); }
.new-note-circle { background: #1C1C1E; border: 0.5px solid #333; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div class="phone">
    <!-- Barre de navigation -->
    <div class="navbar">
        <div class="nav-back-pill" id="backBtn">
            <svg width="10" height="16" viewBox="0 0 10 16"><path d="M9 1L1 8L9 15" stroke="#FFD60A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-back-text">Notes</span>
        </div>
        <div class="nav-right-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white"><path d="M12 15V3m-4 4l4-4 4 4M4 12v8h16v-8"/></svg>
            <div id="dotsBtn" class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>
    </div>

    <!-- Zone de texte -->
    <div class="note-body">
        <div class="note-editor" id="editor" contenteditable="true" spellcheck="false" placeholder="Commencez à écrire..."></div>
    </div>

    <!-- Barre d'outils complète -->
    <div class="toolbar">
        <div class="tb-pill">
            <!-- Tableau -->
            <svg class="tb-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
            <!-- Liste / Anagramme (L'icône magique) -->
            <svg class="tb-icon" id="anaBtn" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><rect x="2" y="4" width="14" height="14" rx="2"/></svg>
            <!-- Scan / Photo -->
            <svg class="tb-icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <!-- Dessin -->
            <svg class="tb-icon" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        </div>
        <div class="new-note-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
    </div>
</div>

let lastValidCandidates = [];
let originalContent = "";
let ghostTimer;
let analyzeTimer;
const editor = document.getElementById('editor');
const dotsBtn = document.getElementById('dotsBtn');
const anaBtn = document.getElementById('anaBtn');
const backBtn = document.getElementById('backBtn');

function normalize(str) {
    return str.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function analyze() {
    const rawLines = editor.innerText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    if (rawLines.length < 2) return;

    const sets = rawLines.map(l => new Set(normalize(l).split('')));
    
    const candidates = DICTIONARY.filter(word => {
        const norm = normalize(word);
        if (norm.length !== rawLines.length) return false;
        for (let i = 0; i < norm.length; i++) {
            if (!sets[i].has(norm[i])) return false;
        }
        return true;
    });

    if (candidates.length > 0) {
        lastValidCandidates = candidates;
        dotsBtn.classList.add('active');
    }
}

editor.oninput = () => {
    clearTimeout(analyzeTimer);
    clearTimeout(ghostTimer);
    
    analyzeTimer = setTimeout(analyze, 1000);

    if (editor.innerText.trim() === "") {
        ghostTimer = setTimeout(() => {
            if (editor.innerText.trim() === "") {
                dotsBtn.classList.remove('active');
                lastValidCandidates = [];
            }
        }, 15000);
    }
};

function getBestLetter(wordList, usedLetters) {
    let counts = {};
    wordList.forEach(w => {
        let uniqueChars = new Set(normalize(w).split(''));
        uniqueChars.forEach(c => {
            if (!usedLetters.has(c)) counts[c] = (counts[c] || 0) + 1;
        });
    });

    let bestChar = null;
    let minDiff = Infinity;

    for (let char in counts) {
        let noCount = wordList.filter(w => !normalize(w).includes(char)).length;
        if (noCount > 0 && noCount <= 2) {
             if (noCount < minDiff) {
                 minDiff = noCount;
                 bestChar = char;
             }
        }
    }
    return bestChar || Object.keys(counts)[0];
}

function runAnagram() {
    if (lastValidCandidates.length < 2) return;
    
    originalContent = editor.innerHTML;
    let currentWords = [...lastValidCandidates];
    let usedLetters = new Set();
    let displayHTML = "";

    for (let i = 0; i < 7; i++) {
        let char = getBestLetter(currentWords, usedLetters);
        if (!char) break;
        usedLetters.add(char);

        let noWords = currentWords.filter(w => !normalize(w).includes(char));
        
        if (noWords.length > 0) {
            let listStr = noWords.map(w => w.toLowerCase()).join(', ');
            displayHTML += `<div class="ana-line"><span class="ana-key">${char} - </span><span class="ana-val">${listStr}</span></div>`;
            currentWords = currentWords.filter(w => normalize(w).includes(char));
        } else {
            displayHTML += `<div class="ana-line"><span class="ana-key">${char} - </span><span class="ana-val">...</span></div>`;
        }

        if (currentWords.length === 1) break;
    }

    if (currentWords.length > 0) {
        displayHTML += `<div class="ana-final">${currentWords[0].toLowerCase()}</div>`;
    }

    editor.innerHTML = displayHTML;
    editor.contentEditable = "false";
}

dotsBtn.onclick = () => {
    if (lastValidCandidates.length === 0) return;
    originalContent = editor.innerHTML;
    const items = lastValidCandidates.slice(0, 3);
    editor.innerHTML = items.map(w => `<span class="replaced-word">${w}</span>`).join('');
    editor.contentEditable = "false";
    dotsBtn.classList.remove('active');
};

anaBtn.onclick = runAnagram;

backBtn.onclick = () => {
    editor.contentEditable = "true";
    if (originalContent) {
        editor.innerHTML = originalContent;
        originalContent = "";
    }
    analyze();
};
</script>
